ona in cui si trova? Quanto sono le spese condominiali? Quando sarà libera?» Alla fine ringrazia: «Scusi il disturbo, grazie!»", "Go into an estate agency (or stop at a 'For rent' sign with a friend) and ask at least three questions using Lei: 'Tell me, what's the area it's in like? How much are the service charges? When will it be free?' At the end, say: 'Sorry to bother you, thank you!'"]}, {"n": 64, "review": false, "topic": "Pronomi combinati me lo, te la, ce li, ve le", "short": "Pronomi combinati me lo, te la, ce li,…", "theme": "prestare e chiedere in prestito", "type": "speak", "cards": [["prestare", "to lend"], ["chiedere in prestito", "to borrow"], ["Me lo presti?", "Will you lend it to me?"], ["restituire", "to give back"], ["Te lo ridò domani.", "I'll give it back to you tomorrow."], ["la scala", "the ladder"], ["il trapano", "the drill"], ["Ce l'hai?", "Have you got it?"]], "hint": ["mi + lo → me lo · ti + la → te la", "ci + li → ce li · vi + le → ve le", "Me lo presti? · Te la do domani."], "ex": [["La penna? ___ presto io! (a te + la)", "te la", "ti + la → te la."], ["Il libro? ___ presti fino a lunedì? (a me + lo)", "me lo", "mi + lo → me lo."], ["Le chiavi? ___ do stasera, ragazzi. (a voi + le)", "ve le", "vi + le → ve le."], ["I biglietti? Marco ___ manda domani. (a noi + li)", "ce li", "ci + li → ce li."], ["— Mi presti il caricabatterie? — Sì, ___ presto subito.", ["ti lo", "te lo", "te li"], 1, "ti + lo → te lo; il caricabatterie is masculine singular."], ["Il trapano? Mi dispiace, non ___ posso prestare. (a te + lo)", "te lo", "Both pronouns go before the modal: non te lo posso prestare."], ["— Ci presti le sedie per la festa? — Certo, ___ presto!", ["ve le", "vi le", "ve li"], 0, "vi + le → ve le (le sedie, feminine plural)."], ["Mamma, ___ presti i soldi per il cinema? (a me + li)", "me li", "mi + li → me li (i soldi)."]], "act": {"type": "speak", "items": [["Un amico ti chiede in prestito la macchina. Cosa gli rispondi?", "A friend asks to borrow your car. What do you answer?"], ["Due amici ti chiedono: «Ci presti le chiavi di casa tua per il weekend?» Cosa rispondi?", "Two friends ask you: 'Will you lend us the keys to your place for the weekend?' What do you answer?"], ["Cosa chiedi in prestito più spesso a un collega o a un vicino? Come lo chiedi?", "What do you borrow most often from a colleague or a neighbour? How do you ask for it?"]]}, "mission": ["Chiedi in prestito una penna a un collega, un vicino o un compagno di corso: «Me la presti un attimo? Te la ridò subito!»", "Ask a colleague, neighbour or classmate to lend you a pen: 'Will you lend it to me for a moment? I'll give it straight back!'"]}, {"n": 65, "review": false, "topic": "Glielo, gliela, glieli, gliele, gliene", "short": "Glielo, gliela, glieli, gliele, gliene", "theme": "negozi e resi", "type": "tr", "cards": [["fare un reso", "to return an item (to a shop)"], ["il rimborso", "the refund"], ["il buono acquisto", "the store credit voucher"], ["difettoso", "faulty"], ["la garanzia", "the warranty"], ["la confezione", "the packaging, the box"], ["l'etichetta", "the label, the tag"], ["cambiare un articolo", "to exchange an item"]], "hint": ["gli / le / Le + lo → glielo · + la → gliela", "+ li → glieli · + le → gliele · + ne → gliene"], "ex": [["Il pacco? ___ porto io, signora. (a Lei + lo)", "glielo", "Le + lo → glielo."], ["La ricevuta? ___ do subito. (a lui + la)", "gliela", "gli + la → gliela."], ["Marta vuole quelle scarpe: ___ compro per il compleanno. (a lei + le)", "gliele", "le + le → gliele."], ["I guanti sono difettosi? ___ cambio subito, signore. (a Lei + li)", "glieli", "Le + li → glieli."], ["Paolo vuole delle mele? ___ porto un chilo. (a lui + ne)", "gliene", "gli + ne → gliene."], ["— Ha lo scontrino? — Sì, ___ do subito.", ["gliela", "glieli", "glielo"], 2, "lo scontrino is masculine singular → glielo."], ["I bambini vogliono un gelato: ___ compro due.", ["gliene", "glieli", "glielo"], 0, "A quantity (due) needs ne → gliene."], ["Signora, se la borsa è difettosa, ___ possiamo cambiare. (a Lei + la)", "gliela", "Both pronouns go before the modal: gliela possiamo cambiare."]], "act": {"type": "tr", "items": [["The receipt? I'll give it to her tomorrow.", "Lo scontrino? Glielo do domani."], ["Is the bag faulty? Madam, I'll change it for you right away.", "La borsa è difettosa? Signora, gliela cambio subito."], ["Luca wants the shoes: I'll buy them for him.", "Luca vuole le scarpe: gliele compro io."], ["Does he want some apples? I'll give him three.", "Vuole delle mele? Gliene do tre."]]}, "mission": ["In un negozio, scegli un piccolo regalo e chiedi: «Se a mia sorella non piace, posso cambiarlo?» Se ti dicono di sì, rispondi: «Perfetto, allora glielo prendo!»", "In a shop, pick a small present and ask: 'If my sister doesn't like it, can I exchange it?' If they say yes, answer: 'Perfect, then I'll get it for her!'"]}, {"n": 66, "review": false, "topic": "Pronomi combinati con passato prossimo e imperativo", "short": "Pronomi combinati con passato prossimo…", "theme": "favori", "type": "write", "cards": [["Mi fai un favore?", "Can you do me a favour?"], ["Ti devo un favore.", "I owe you one."], ["innaffiare le piante", "to water the plants"], ["dare da mangiare al gatto", "to feed the cat"], ["ritirare un pacco", "to collect a parcel"], ["tenere d'occhio", "to keep an eye on"], ["Sei un tesoro!", "You're a star!"], ["Mi raccomando!", "Don't forget! / Please make sure!"]], "hint": ["Me l'hai detto · Gliel'ho data · Ve le ho mandate", "Dammelo! · Diglielo! · Non dirglielo! (Non glielo dire!)"], "ex": [["Il pacco? ___ ritirato io ieri. (a te + lo, avere, io)", "te l'ho", "ti + lo → te lo; lo + ho → l'ho."], ["La notizia? ___ detta Marco. (a me + la, avere)", "me l'ha", "mi + la → me la; la + ha → l'ha, and detta agrees."], ["Le chiavi? ___ date ieri sera. (a lui + le, avere, io)", "gliele ho", "gli + le → gliele; le doesn't elide: gliele ho."], ["Il libro? ___ subito! (dare + a me + lo, tu)", "dammelo", "da' + me + lo → dammelo, all attached."], ["È una sorpresa per Anna: non ___! (dire + a lei + lo, tu)", "dirglielo|glielo dire", "Negative tu: non + infinitive; pronouns attached or before."], ["— Chi ti ha innaffiato le piante? — ___ ha innaffiate la vicina.", ["Me l'", "Me le", "Mi le"], 1, "mi + le → me le; plural le doesn't elide."], ["La lettera per il direttore? ___ tu, per favore: io non ho tempo!", ["Mandagliela", "Gliela manda", "Mandaglila"], 0, "tu imperative + gli + la → mandagliela, all attached."], ["Le foto della festa? ___ mandate ieri, ragazzi! (a voi + le, avere, io)", "ve le ho", "vi + le → ve le; mandate agrees with le foto."]], "act": {"type": "write", "task": "Scrivi un messaggio a un vicino o a un amico: chiedigli tre favori per quando sei in vacanza (le piante, il gatto, un pacco). Poi racconta un favore che qualcuno ti ha fatto: cosa ti ha prestato o portato, e quando te l'ha dato?", "en": "Write a message to a neighbour or a friend: ask them for three favours while you're on holiday (the plants, the cat, a parcel). Then tell about a favour someone did for you: what did they lend or bring you, and when did they give it to you?", "target": "pronomi combinati con imperativo e passato prossimo (ritiramelo, me l'ha prestato, gliel'ho detto)", "words": "80–120"}, "mission": ["Al bar o in biblioteca, chiedi a un amico o a un collega: «Mi fai un favore? La borsa: me la tieni d'occhio un attimo?» Quando torni: «Grazie, ti devo un favore!»", "At a café or in the library, ask a friend or colleague: 'Can you do me a favour? My bag: will you keep an eye on it for a moment?' When you come back: 'Thanks, I owe you one!'"]}, {"n": 67, "review": false, "topic": "Ci vuole / ci vogliono, metterci, farcela, andarsene", "short": "Ci vuole / ci vogliono, metterci,…", "theme": "tempo e durata", "type": "speak", "cards": [["Quanto ci vuole?", "How long does it take?"], ["Ci vogliono due ore.", "It takes two hours."], ["Quanto ci metti?", "How long does it take you?"], ["Ce la fai?", "Can you manage?"], ["Non ce la faccio più!", "I can't take it anymore!"], ["Me ne vado.", "I'm leaving."], ["Ce ne andiamo?", "Shall we go?"], ["di corsa", "in a rush"]], "hint": ["Ci vuole un'ora. · Ci vogliono due ore.", "Ci metto dieci minuti. · Ce la faccio! · Me ne vado."], "ex": [["Per arrivare a Firenze ___ un'ora di treno. (volerci, presente)", "ci vuole", "Singular (un'ora) → ci vuole."], ["Per fare un buon ragù ___ tre ore. (volerci, presente)", "ci vogliono", "Plural (tre ore) → ci vogliono."], ["Io ___ venti minuti per andare al lavoro. (metterci, presente)", "ci metto", "metterci with a person: io ci metto."], ["Quanto ___ tu a prepararti la mattina? (metterci, presente)", "ci metti", "tu ci metti."], ["La valigia è pesante: ___ da solo?", ["ce lo fai", "ce la fai", "ci fai"], 1, "farcela: ce la faccio, ce la fai…"], ["È tardi, noi ___. Buonanotte! (andarsene, presente)", "ce ne andiamo", "andarsene: me ne vado, ce ne andiamo."], ["Ieri il treno ___ quattro ore per arrivare a Bari. (metterci, passato prossimo)", "ci ha messo", "metterci takes avere: ci ha messo."], ["Ieri alla festa Marta era stanca e ___ alle dieci.", ["se ne ha andata", "se n'è andato", "se n'è andata"], 2, "andarsene takes essere and agrees: se n'è andata."]], "act": {"type": "speak", "items": [["Quanto ci metti per andare da casa al lavoro o a scuola?", "How long does it take you to get from home to work or school?"], ["Quanto tempo ci vuole per preparare il tuo piatto preferito?", "How much time does it take to make your favourite dish?"], ["A una festa noiosa te ne vai subito o resti? Quando dici «Non ce la faccio più»?", "At a boring party, do you leave straight away or stay? When do you say 'I can't take it anymore'?"]]}, "mission": ["Alla fermata dell'autobus o in stazione chiedi a qualcuno: «Scusi, quanto ci vuole per arrivare in centro?» oppure «Quanto ci mette l'autobus?»", "At the bus stop or the station, ask someone: 'Excuse me, how long does it take to get to the centre?' or 'How long does the bus take?'"]}, {"n": 68, "review": false, "topic": "Connettivi: quindi, però, invece, siccome, infatti, anche se", "short": "Connettivi: quindi, però, invece,…", "theme": "raccontare", "type": "tr", "cards": [["all'improvviso", "suddenly"], ["a un certo punto", "at some point"], ["per fortuna", "luckily"], ["insomma", "in short, basically"], ["Sai cos'è successo?", "Do you know what happened?"], ["Pensa che…", "Just imagine…"], ["comunque", "anyway"], ["nel frattempo", "in the meantime"]], "hint": ["Piove, quindi resto a casa. · Siccome piove, resto a casa.", "È tardi, però esco. · Anche se è tardi, esco.", "Io bevo tè, Marco invece beve caffè. · È bravo: infatti ha vinto."], "ex": [["Il treno era in ritardo, ___ ho perso la coincidenza. (so)", "quindi|perciò|così|allora|dunque|per questo|per cui", "A consequence → quindi."], ["Il ristorante è un po' caro, ___ è buonissimo. (but)", "però|ma|tuttavia|comunque", "A contrast → però (or ma)."], ["___ ero stanco, sono uscito con gli amici. (even though)", "anche se", "anche se + indicative = even though."], ["Io bevo il caffè amaro, mio marito ___ lo prende con lo zucchero. (on the other hand)", "invece|però", "Comparing two people → invece."], ["___ avevo fame, ho mangiato una pizza.", ["Quindi", "Siccome", "Però"], 1, "Siccome = since: the cause comes first."], ["___ il negozio era chiuso, siamo tornati a casa. (since)", "siccome|poiché|dato che|visto che|giacché|dal momento che", "The cause at the start of the sentence → siccome."], ["Luca parla benissimo il tedesco: ___ ha vissuto a Berlino per dieci anni. (in fact)", "infatti|difatti|in effetti|del resto", "infatti confirms and explains what you just said."], ["Vado in ufficio a piedi ___ piove.", ["infatti", "siccome", "anche se"], 2, "I walk despite the rain → anche se."]], "act": {"type": "tr", "items": [["I was tired, so I went to bed early.", "Ero stanco, quindi sono andato a letto presto. (Ero stanca, quindi sono andata…)"], ["Since it was raining, we took a taxi.", "Siccome pioveva, abbiamo preso un taxi."], ["I like the sea; my sister, on the other hand, prefers the mountains.", "A me piace il mare, mia sorella invece preferisce la montagna."], ["Even though it's expensive, I go to that bar every day.", "Anche se è caro, vado in quel bar tutti i giorni."]]}, "mission": ["Al bar o con un vicino, racconta in tre frasi una cosa che ti è successa questa settimana. Usa almeno due connettivi tra «siccome», «però», «quindi» e «anche se».", "At the café or with a neighbour, tell something that happened to you this week in three sentences. Use at least two connectors among 'siccome', 'però', 'quindi' and 'anche se'."]}, {"n": 69, "review": false, "topic": "Verbi con preposizione", "short": "Verbi con preposizione", "theme": "obiettivi e abitudini", "type": "write", "cards": [["cercare di", "to try to"], ["riuscire a", "to manage to"], ["smettere di fumare", "to quit smoking"], ["provare a", "to have a go at, to try"], ["decidere di", "to decide to"], ["abituarsi a", "to get used to"], ["il buon proposito", "the resolution"], ["tenersi in forma", "to keep fit"]], "hint": ["cerco di dormire · ho smesso di fumare · ho deciso di partire", "riesco a svegliarmi · provo a cucinare · penso a te"], "ex": [["Quest'anno cerco ___ andare a letto prima. (preposizione)", "di", "cercare di + infinitive."], ["Non riesco ___ svegliarmi alle sei. (preposizione)", "a", "riuscire a + infinitive."], ["Mio padre ha smesso ___ fumare dieci anni fa. (preposizione)", "di", "smettere di + infinitive."], ["Penso spesso ___ mia nonna. (preposizione)", "a", "pensare a qualcuno = to think about someone."], ["Finalmente ___ a correre dieci chilometri!", ["ho cercato", "sono riuscito", "ho smesso"], 1, "Only riuscire takes a: sono riuscito a."], ["Ieri Sara non ___ a finire il lavoro. (riuscire, passato prossimo)", "è riuscita", "riuscire takes essere: è riuscita."], ["Mi sto abituando ___ vivere in Italia. (preposizione)", "a", "abituarsi a + infinitive."], ["Penso ___ cambiare casa l'anno prossimo.", ["da", "per", "di"], 2, "pensare di + infinitive = to plan to."]], "act": {"type": "write", "task": "Scrivi i tuoi buoni propositi per i prossimi mesi: cosa cerchi di fare, cosa vuoi smettere di fare, a cosa pensi spesso e cosa sei già riuscito a fare quest'anno.", "en": "Write your resolutions for the coming months: what you're trying to do, what you want to stop doing, what you often think about and what you've already managed to do this year.", "target": "verbi con preposizione (cercare di, smettere di, riuscire a, pensare a / di)", "words": "80–120"}, "mission": ["Chiedi a un collega o a un amico: «Hai un buon proposito per quest'anno?» Poi racconta il tuo: «Sto cercando di…» oppure «Ho smesso di…»", "Ask a colleague or friend: 'Do you have a resolution for this year?' Then tell them yours: 'I'm trying to…' or 'I've stopped…'"]}, {"n": 70, "review": true, "topic": "Ripasso della settimana 10", "short": "Ripasso", "theme": "", "type": "write", "cards": [], "hint": [], "ex": [], "act": {"type": "write", "task": "Diario della settimana: racconta un favore che hai chiesto o fatto (qualcuno ti ha prestato qualcosa? quando te l'ha dato? e tu, cosa hai prestato e a chi?), quanto ci hai messo a fare una cosa difficile e se ce l'hai fatta. Scrivi anche cosa cerchi di cambiare. Collega le frasi con i connettivi.", "en": "Diary of the week: tell about a favour you asked for or did (did someone lend you something? when did they give it to you? and what did you lend, and to whom?), how long it took you to do something difficult and whether you managed. Also write what you're trying to change. Link your sentences with connectors.", "target": "pronomi combinati, metterci / ci vuole / farcela, connettivi (quindi, però, siccome, anche se), cercare di / riuscire a", "words": "80–120"}, "mission": ["In un negozio chiedi come funzionano i resi: «Se il regalo non va bene, me lo cambiate? Quanto ci vuole per il rimborso? Siccome è un regalo, mi può dare uno scontrino di cortesia?» Alla fine ringrazia e saluta.", "In a shop, ask how returns work: 'If the present isn't right, will you exchange it for me? How long does the refund take? Since it's a present, can you give me a gift receipt?' At the end, say thanks and goodbye."]}, {"n": 71, "review": false, "topic": "Congiuntivo presente regolare dopo penso che / credo che", "short": "Congiuntivo presente regolare dopo…", "theme": "opinioni", "type": "speak", "cards": [["il punto di vista", "the point of view"], ["l'opinione", "the opinion"], ["avere ragione", "to be right"], ["avere torto", "to be wrong"], ["Sono d'accordo.", "I agree."], ["Credo di sì.", "I think so."], ["Dipende.", "It depends."], ["convincere", "to convince"]], "hint": ["Penso che Luca lavori troppo. · Credo che i ragazzi dormano poco.", "parlare → parli, parliamo, parliate, parlino · prendere → prenda, prendano", "dormire → dorma · capire → capisca, capiscano"], "ex": [["Penso che Giulia ___ bene l'italiano. (parlare)", "parli", "penso che + congiuntivo: lei parli."], ["Credo che Marco ___ in banca. (lavorare)", "lavori", "credo che + congiuntivo: lui lavori."], ["Penso che i bambini ___ troppo poco. (dormire)", "dormano", "-ire verbs, loro: dormano."], ["Credo che Anna ___ il treno delle otto.", ["prendiate", "prenda", "prendano"], 1, "Anna = lei: congiuntivo prenda."], ["Pensi che Luca ___ il problema? (capire)", "capisca", "capire keeps -isc-: che lui capisca."], ["Credo che voi ___ troppo il telefono. (usare)", "usiate", "voi in the congiuntivo: -iate."], ["Penso che noi ___ troppo.", ["lavorino", "lavoriamo", "lavori"], 1, "noi: the congiuntivo looks like the present (lavoriamo)."], ["Credo che Marta ___ di lavorare alle sei tutti i giorni. (finire)", "finisca", "finire keeps -isc-: che lei finisca."]], "act": {"type": "speak", "items": [["Pensi che gli italiani parlino troppo velocemente?", "Do you think Italians speak too fast?"], ["Credi che in Italia i giovani guadagnino abbastanza?", "Do you think young people in Italy earn enough?"], ["Pensi che i negozi nel tuo quartiere chiudano troppo presto?", "Do you think the shops in your neighbourhood close too early?"]]}, "mission": ["Al bar, di' al barista la tua opinione con «Penso che…», per esempio: «Penso che qui preparino il cappuccino migliore della zona!»", "At the bar, tell the barista your opinion with «Penso che…», for example: «I think they make the best cappuccino in the area here!»"]}, {"n": 72, "review": false, "topic": "Congiuntivo presente irregolare", "short": "Congiuntivo presente irregolare", "theme": "persone e caratteri", "type": "tr", "cards": [["il pregio", "the good quality (of a person)"], ["il difetto", "the flaw"], ["egoista", "selfish"], ["antipatico", "unpleasant, not likeable"], ["affidabile", "reliable"], ["geloso", "jealous"], ["sincero", "sincere, honest"], ["la fiducia", "trust"]], "hint": ["essere → sia, siamo, siate, siano · avere → abbia, abbiamo, abbiate, abbiano", "andare → vada · fare → faccia · potere → possa · volere → voglia", "Penso che Marco sia sincero."], "ex": [["Penso che Paolo ___ molto affidabile. (essere)", "sia", "essere, congiuntivo: lui sia."], ["Credo che Chiara ___ un buon carattere. (avere)", "abbia", "avere, congiuntivo: lei abbia."], ["Penso che i miei vicini ___ al mare ogni weekend. (andare)", "vadano", "andare, congiuntivo: loro vadano."], ["Penso che tu ___ ragione.", ["abbia", "abbiate", "abbiano"], 0, "tu in the congiuntivo: abbia (same as io and lui)."], ["Penso che i bambini non ___ mangiare il cioccolato la sera. (potere)", "possano", "potere, congiuntivo: loro possano."], ["Credo che voi ___ troppo gelosi. (essere)", "siate", "essere, congiuntivo: voi siate."], ["Non credo che Giorgio ___ cambiare carattere.", ["voglia", "vogliano", "vogliamo"], 0, "Giorgio = lui: voglia."], ["Credo che Marco ___ il cuoco in un ristorante. (fare)", "faccia", "fare, congiuntivo: lui faccia."]], "act": {"type": "tr", "items": [["I think Luca is very selfish.", "Penso che Luca sia molto egoista. (Credo che…)"], ["I believe Anna has a lot of patience.", "Credo che Anna abbia molta pazienza."], ["I don't think they want to come.", "Non penso che vogliano venire."], ["I think you are right. (tu)", "Penso che tu abbia ragione."]]}, "mission": ["Fai un complimento a un collega, a un amico o a un vicino: «Penso che tu sia una persona molto affidabile!»", "Pay a compliment to a colleague, a friend or a neighbour: «I think you are a very reliable person!»"]}, {"n": 73, "review": false, "topic": "Voglio che / spero che / ho paura che + congiuntivo", "short": "Voglio che / spero che / ho paura che +…", "theme": "desideri e preoccupazioni", "type": "write", "cards": [["la preoccupazione", "the worry"], ["la speranza", "hope"], ["il desiderio", "the wish"], ["Speriamo bene!", "Let's hope for the best!"], ["Magari!", "If only! / I wish!"], ["Incrociamo le dita!", "Fingers crossed!"], ["temere", "to fear"], ["l'ansia", "anxiety"]], "hint": ["Voglio che tu venga. · Spero che Marco stia bene.", "Ho paura che piova. · Spero che arrivi (arriverà) presto."], "ex": [["Voglio che tu ___ il biglietto oggi. (comprare)", "compri", "voglio che + congiuntivo: tu compri."], ["Spero che Marco ___ bene. (stare)", "stia|starà", "stare, congiuntivo: lui stia (after sperare the futuro also works)."], ["Ho paura che domani ___. (piovere)", "piova|pioverà", "ho paura che + congiuntivo: piova (futuro also possible)."], ["Mia madre vuole che io ___ il medico.", ["fare", "faccia", "facciano"], 1, "vuole che + congiuntivo: io faccia."], ["Speriamo che il treno non ___ in ritardo. (essere)", "sia|sarà", "spero che + congiuntivo: sia (or futuro: sarà)."], ["Ho paura che Luca non ___ la strada. (trovare)", "trovi|troverà", "ho paura che + congiuntivo: lui trovi (futuro also possible)."], ["I miei genitori vogliono che noi ___ da loro domenica. (andare)", "andiamo", "andare, congiuntivo noi: andiamo."], ["Spero che voi ___ un bel weekend.", ["abbiano", "abbiate", "abbia"], 1, "voi in the congiuntivo: abbiate."]], "act": {"type": "write", "task": "Un amico inizia un nuovo lavoro in un'altra città. Scrivigli un messaggio: che cosa speri per lui, che cosa vuoi che faccia e di che cosa hai paura.", "en": "A friend is starting a new job in another city. Write him a message: what you hope for him, what you want him to do and what you are afraid of.", "target": "spero che / voglio che / ho paura che + congiuntivo presente", "words": "80–120"}, "mission": ["Quando saluti un vicino o un collega, aggiungi un augurio: «Spero che tu abbia una bella giornata!» oppure, con il Lei: «Spero che abbia una bella giornata!»", "When you say goodbye to a neighbour or a colleague, add a wish: «I hope you have a nice day!» or, formally: «I hope you have a nice day!» (Lei)"]}, {"n": 74, "review": false, "topic": "Congiuntivo o indicativo? stesso soggetto → di + infinito", "short": "Congiuntivo o indicativo? stesso…", "theme": "lavoro e studio", "type": "speak", "cards": [["il datore di lavoro", "the employer"], ["candidarsi", "to apply (for a job)"], ["la laurea", "the university degree"], ["laurearsi", "to graduate"], ["lo stage", "the internship"], ["licenziarsi", "to quit (a job)"], ["il contratto a tempo indeterminato", "the permanent contract"], ["la busta paga", "the payslip"]], "hint": ["Penso di cambiare lavoro. (io → io)", "Penso che Marco cambi lavoro. (io → Marco)", "So che Marco cambia lavoro. (è sicuro → indicativo)"], "ex": [["Penso ___ un corso di inglese. (fare, io)", "di fare", "Same subject (io → io): penso di + infinitive."], ["Penso che Luca ___ uno stage in banca in questo periodo. (fare)", "faccia|stia facendo", "Different subject: penso che + congiuntivo (lui faccia)."], ["Spero ___ il colloquio di lunedì. (passare, io)", "di passare", "Same subject: spero di + infinitive."], ["Spero che mia figlia ___ il prossimo anno. (laurearsi)", "si laurei|si laureerà", "Different subject: spero che + congiuntivo (or futuro)."], ["So che adesso Marta ___ in un ufficio in centro. (lavorare)", "lavora", "sapere che = a sure fact → indicativo."], ["Sappiamo che Luca ___ a Roma per lavoro.", ["vive", "viva", "vivere"], 0, "sapere che + indicativo: vive."], ["Credo ___ ragione io.", ["che ho", "di avere", "che io abbia"], 1, "Same subject (io → io): credo di + infinitive."], ["Mio padre vuole che io ___ in banca. (lavorare)", "lavori", "Different subject: vuole che + congiuntivo (io lavori)."]], "act": {"type": "speak", "items": [["Pensi di cambiare lavoro nei prossimi anni?", "Are you thinking of changing jobs in the next few years?"], ["Che cosa speri di fare tra cinque anni?", "What do you hope to be doing in five years?"], ["Pensi che in Italia sia facile trovare lavoro?", "Do you think it's easy to find a job in Italy?"]]}, "mission": ["Chiedi a un collega o a un amico: «Pensi di prendere le ferie ad agosto?» e poi rispondi anche tu: «Io penso di…»", "Ask a colleague or a friend: «Are you thinking of taking your holidays in August?» and then answer too: «I'm thinking of…»"]}, {"n": 75, "review": false, "topic": "Benché, affinché, prima che, a meno che + congiuntivo", "short": "Benché, affinché, prima che, a meno che…", "theme": "società e tecnologia", "type": "tr", "cards": [["la rete", "the network, the internet"], ["scaricare", "to download"], ["aggiornare", "to update"], ["il dispositivo", "the device"], ["la connessione", "the connection"], ["i social", "social media"], ["la società", "society"], ["il cambiamento", "the change"]], "hint": ["Benché sia tardi, lavoro ancora. · Te lo spiego affinché tu capisca.", "Esco prima che piova. · Vengo, a meno che non piova.", "Prima di uscire, spengo il computer. (io → io)"], "ex": [["Benché Luca ___ un telefono nuovo, usa sempre il computer. (avere)", "abbia", "benché + congiuntivo: lui abbia."], ["Ti mando il link affinché tu ___ scaricare l'app. (potere)", "possa", "affinché + congiuntivo: tu possa."], ["Metti in carica il telefono prima che la batteria ___. (scaricarsi)", "si scarichi", "prima che + congiuntivo: si scarichi."], ["Domani lavoro da casa, a meno che il capo non mi ___ in ufficio. (chiamare)", "chiami", "a meno che (non) + congiuntivo: lui chiami."], ["___ il telefono sia vecchio, funziona ancora bene.", ["Benché", "Anche se", "Perché"], 0, "sia is congiuntivo, so benché; anche se takes the indicativo."], ["Prima ___ dall'ufficio, spengo sempre il computer. (uscire, io)", "di uscire", "Same subject: prima di + infinitive."], ["Anche se Sara ___ giovane, non usa i social.", ["è", "sia", "essere"], 0, "anche se + indicativo: è."], ["Parlo lentamente affinché i bambini ___ tutto. (capire)", "capiscano", "affinché + congiuntivo: loro capiscano."]], "act": {"type": "tr", "items": [["Although it's late, I'm still working.", "Benché sia tardi, lavoro ancora."], ["I'll explain it to you so that you understand.", "Te lo spiego affinché tu capisca."], ["Let's go home before it rains.", "Andiamo a casa prima che piova."], ["I'm coming tomorrow, unless my son is ill.", "Domani vengo, a meno che mio figlio non stia male."]]}, "mission": ["Quando saluti un collega o un amico, fai un piano con «a meno che»: «Ci vediamo domani al bar, a meno che non piova!»", "When you say goodbye to a colleague or a friend, make a plan with «a meno che»: «See you tomorrow at the bar, unless it rains!»"]}, {"n": 76, "review": false, "topic": "È importante che, bisogna che, è meglio che + congiuntivo", "short": "È importante che, bisogna che, è meglio…", "theme": "regole e consigli", "type": "write", "cards": [["la regola", "the rule"], ["il divieto", "the ban"], ["obbligatorio", "compulsory"], ["consentito", "allowed"], ["rispettare", "to respect, to follow (rules)"], ["evitare", "to avoid"], ["fare attenzione", "to pay attention, to be careful"], ["la raccolta differenziata", "separate waste collection, recycling"]], "hint": ["È importante che tu arrivi in orario. · Bisogna che paghiate subito.", "È meglio che Marco resti a casa. · È meglio partire presto. (per tutti)"], "ex": [["È importante che tu ___ le regole del condominio. (rispettare)", "rispetti", "è importante che + congiuntivo: tu rispetti."], ["Bisogna che voi ___ la tassa entro venerdì. (pagare)", "paghiate", "bisogna che + congiuntivo: voi paghiate (with h)."], ["È meglio che Luca non ___ il motorino in centro. (prendere)", "prenda", "è meglio che + congiuntivo: lui prenda."], ["Bisogna che tutti ___ la raccolta differenziata.", ["fare", "facciano", "fanno"], 1, "bisogna che + congiuntivo: loro facciano."], ["È meglio che noi ___ la macchina fuori dal centro. (lasciare)", "lasciamo", "noi congiuntivo: lasciamo."], ["In biblioteca è obbligatorio che i telefoni ___ spenti. (essere)", "siano", "è obbligatorio che + congiuntivo: siano."], ["È meglio ___ il biglietto online: costa meno.", ["di comprare", "comprare", "che comprare"], 1, "General advice: è meglio + infinitive, no di."], ["Signora, bisogna che Lei ___ questo modulo. (firmare)", "firmi", "Lei takes the lui/lei form: firmi."]], "act": {"type": "write", "task": "Un amico straniero va a vivere in un condominio in Italia. Scrivigli dei consigli: che cosa è importante che faccia, che cosa bisogna che eviti e che cosa è meglio che non faccia.", "en": "A foreign friend is going to live in an apartment building in Italy. Write him some advice: what it's important that he does, what he needs to avoid and what he'd better not do.", "target": "è importante che / bisogna che / è meglio che + congiuntivo presente", "words": "80–120"}, "mission": ["Leggi un cartello nel tuo palazzo, in un parco o sul bus (per esempio «È vietato…») e spiega la regola a un amico con «Bisogna che…» o «È importante che…».", "Read a sign in your building, in a park or on the bus (for example «È vietato…») and explain the rule to a friend with «Bisogna che…» or «È importante che…»."]}, {"n": 77, "review": true, "topic": "Ripasso della settimana 11", "short": "Ripasso", "theme": "", "type": "write", "cards": [], "hint": [], "ex": [], "act": {"type": "write", "task": "Diario della settimana: che cosa pensi delle persone che hai incontrato questa settimana? Che cosa speri per la prossima settimana e di che cosa hai paura? Che cosa è importante che tu faccia?", "en": "Diary of the week: what do you think of the people you met this week? What do you hope for next week and what are you afraid of? What is it important for you to do?", "target": "congiuntivo presente: penso che, spero che, ho paura che, è importante che, benché", "words": "80–120"}, "mission": ["Fai due chiacchiere con un vicino o con il barista sul quartiere. Chiedi: «Secondo Lei, il quartiere è cambiato?» Poi di' almeno tre frasi con il congiuntivo: «Penso che…», «Spero che…», «È importante che…».", "Have a chat with a neighbour or the barista about the neighbourhood. Ask: «In your opinion, has the neighbourhood changed?» Then say at least three sentences with the congiuntivo: «I think that…», «I hope that…», «It's important that…»."]}, {"n": 78, "review": false, "topic": "Condizionale passato", "short": "Condizionale passato", "theme": "rimpianti", "type": "speak", "cards": [["il rimpianto", "the regret"], ["pentirsi", "to regret, to be sorry"], ["l'occasione", "the opportunity"], ["Avrei dovuto…", "I should have…"], ["Sarebbe stato meglio.", "It would have been better."], ["tornare indietro", "to go back (in time)"], ["lo sbaglio", "the mistake"], ["rinunciare a", "to give up (on something)"]], "hint": ["avrei voluto · avresti dovuto · avremmo potuto", "sarei venuto/a · saresti andato/a · sarebbero partiti", "Ieri sarei venuto, ma ero stanco."], "ex": [["Ieri ___ studiare, ma ero stanco. (dovere, io, condizionale passato)", "avrei dovuto", "dovere + studiare: avrei dovuto."], ["Marco ___ alla festa, ma aveva l'influenza. (venire, condizionale passato)", "sarebbe venuto", "venire takes essere: sarebbe venuto."], ["Con più tempo, noi ___ il Colosseo. (visitare, condizionale passato)", "avremmo visitato", "visitare takes avere: avremmo visitato."], ["Mi dispiace, io ___ chiamarti prima.", ["avrei dovuto", "sarei dovuto", "avrebbe dovuto"], 0, "io + chiamare (avere): avrei dovuto."], ["Le ragazze ___ prima, ma il treno era in ritardo. (arrivare, condizionale passato)", "sarebbero arrivate", "arrivare takes essere; le ragazze → arrivate."], ["Al mio posto, tu ___ quella casa a Bologna? (comprare, condizionale passato)", "avresti comprato", "tu + avere: avresti comprato."], ["Ieri voi ___ al mare, ma pioveva.", ["avreste andato", "sareste andati", "andreste"], 1, "andare takes essere; past wish → sareste andati."], ["Al tuo posto, io non ___ a quell'occasione. (rinunciare, condizionale passato)", "avrei rinunciato", "rinunciare takes avere: avrei rinunciato."]], "act": {"type": "speak", "items": [["C'è una cosa che avresti voluto fare da giovane?", "Is there something you would have liked to do when you were young?"], ["Che cosa avresti fatto di diverso il tuo primo giorno in Italia?", "What would you have done differently on your first day in Italy?"], ["Quale lingua avresti voluto imparare da bambino?", "Which language would you have liked to learn as a child?"]]}, "mission": ["Al bar o al lavoro, racconta a qualcuno una piccola cosa di ieri con il condizionale passato: «Ieri sarei andato/a in palestra, ma…» o «Avrei dovuto…».", "At the bar or at work, tell someone something small about yesterday with the condizionale passato: «Yesterday I would have gone to the gym, but…» or «I should have…»."]}, {"n": 79, "review": false, "topic": "Congiuntivo imperfetto: forme", "short": "Congiuntivo imperfetto: forme", "theme": "sogni", "type": "tr", "cards": [["sognare", "to dream"], ["realizzare un sogno", "to make a dream come true"], ["vincere la lotteria", "to win the lottery"], ["Magari fosse vero!", "If only it were true!"], ["diventare famoso", "to become famous"], ["il colpo di fortuna", "the stroke of luck"], ["immaginare", "to imagine"], ["la barca a vela", "the sailing boat"]], "hint": ["parlare → parlassi, parlasse, parlassimo, parlaste, parlassero", "essere → fossi · avere → avessi · fare → facessi · dare → dessi · stare → stessi", "Magari avessi più tempo! · Magari fosse vero!"], "ex": [["Magari ___ più tempo libero! (avere, io, congiuntivo imperfetto)", "avessi", "avere, congiuntivo imperfetto: io avessi."], ["Magari il capo mi ___ un aumento! (dare, congiuntivo imperfetto)", "desse", "dare, congiuntivo imperfetto: lui desse."], ["Magari Luca ___ l'italiano come me! (parlare, congiuntivo imperfetto)", "parlasse", "parlare → lui parlasse."], ["Magari noi ___ in una villa al mare!", ["vivessimo", "vivessero", "vivessi"], 0, "noi: vivessimo."], ["Magari i miei figli ___ medici! (diventare, congiuntivo imperfetto)", "diventassero", "loro: diventassero."], ["Magari ___ in vacanza adesso! (essere, io, congiuntivo imperfetto)", "fossi", "essere → io fossi."], ["Magari voi ___ più sport!", ["facessi", "faceste", "facessero"], 1, "fare, voi: faceste."], ["Magari ___ la lotteria! (vincere, noi, congiuntivo imperfetto)", "vincessimo", "vincere → noi vincessimo."]], "act": {"type": "tr", "items": [["If only I had a boat!", "Magari avessi una barca!"], ["If only it were true!", "Magari fosse vero!"], ["If only my parents lived in Italy!", "Magari i miei genitori vivessero in Italia!"], ["If only we won the lottery!", "Magari vincessimo la lotteria!"]]}, "mission": ["Al bar o al lavoro, quando qualcuno parla di vacanze o di soldi, rispondi con un «Magari…!», per esempio: «Magari avessi un mese di ferie!»", "At the bar or at work, when someone talks about holidays or money, answer with a «Magari…!», for example: «If only I had a month off!»"]}, {"n": 80, "review": false, "topic": "Congiuntivo imperfetto dopo pensavo che / vorrei che", "short": "Congiuntivo imperfetto dopo pensavo che…", "theme": "aspettative", "type": "write", "cards": [["l'aspettativa", "the expectation"], ["aspettarsi", "to expect"], ["Non me l'aspettavo!", "I didn't expect it!"], ["deludere", "to disappoint"], ["la delusione", "the disappointment"], ["superare le aspettative", "to exceed expectations"], ["essere all'altezza", "to live up to it, to be good enough"], ["peggiorare", "to get worse"]], "hint": ["Pensavo che Roma fosse più cara.", "Credevo che tu parlassi inglese. · Vorrei che tu venissi con me."], "ex": [["Pensavo che il museo ___ gratis. (essere)", "fosse", "pensavo che + congiuntivo imperfetto: fosse."], ["Credevo che tu ___ ancora a Milano. (abitare)", "abitassi", "credevo che + congiuntivo imperfetto: tu abitassi."], ["Vorrei che Marco ___ più gentile con sua sorella. (essere)", "fosse", "vorrei che + congiuntivo imperfetto: lui fosse."], ["Pensavo che il ristorante ___ migliore.", ["fossero", "fosse", "fossimo"], 1, "il ristorante = lui: fosse."], ["Vorrei che voi ___ con noi in montagna. (venire)", "veniste", "vorrei che + congiuntivo imperfetto: voi veniste."], ["Non mi aspettavo che i prezzi ___ così alti. (essere)", "fossero", "i prezzi = loro: fossero."], ["Vorrei che tu mi ___ più spesso.", ["telefonassero", "telefonassimo", "telefonassi"], 2, "tu: telefonassi."], ["Credevamo che Luca ___ tre figli. (avere)", "avesse", "credevamo che + congiuntivo imperfetto: lui avesse."]], "act": {"type": "write", "task": "Racconta il tuo arrivo in Italia: che cosa pensavi prima di arrivare e che cosa hai scoperto? Che cosa vorresti che cambiasse adesso nella tua vita qui?", "en": "Tell the story of your arrival in Italy: what did you think before you arrived and what did you discover? What would you like to change now in your life here?", "target": "pensavo che / credevo che / vorrei che + congiuntivo imperfetto", "words": "80–120"}, "mission": ["Quando assaggi qualcosa di nuovo al bar o al mercato, di' al barista o al venditore: «Pensavo che fosse più dolce!» o «Non mi aspettavo che fosse così buono!»", "When you taste something new at the bar or the market, tell the barista or the seller: «I thought it was sweeter!» or «I didn't expect it to be so good!»"]}, {"n": 81, "review": false, "topic": "Periodo ipotetico tipo 1", "short": "Periodo ipotetico tipo 1", "theme": "ambiente e natura", "type": "speak", "cards": [["l'ambiente", "the environment"], ["l'inquinamento", "pollution"], ["inquinare", "to pollute"], ["riciclare", "to recycle"], ["sprecare", "to waste"], ["il bosco", "the woods"], ["la plastica", "plastic"], ["il cassonetto", "the (street) rubbish bin"]], "hint": ["Se piove, resto a casa. · Se piove, resterò a casa.", "Se pioverà, resterò a casa. · Se vai al mare, porta via la plastica!"], "ex": [["Se ___ bel tempo, andiamo nel bosco. (fare, presente)", "fa", "Real condition: se + presente (fa)."], ["Se usiamo meno la macchina, l'aria ___ più pulita. (essere, presente)", "è", "Real condition: se + presente, then presente."], ["Se tu non ___ la luce, sprechi energia. (spegnere, presente)", "spegni", "spegnere, tu: spegni."], ["Se domani piove, ___ a casa.", ["resteremmo", "resteremo", "saremmo restati"], 1, "Real condition: futuro (or presente), not condizionale."], ["Se ___ al parco, portate via i rifiuti! (andare, voi, presente)", "andate", "se + presente, then imperativo."], ["Se tutti ___ meno acqua, ne avremo di più. (sprecare, futuro)", "sprecheranno", "se + futuro, then futuro; sprecare keeps the h."], ["Se ___ la bici, risparmi soldi e aiuti l'ambiente.", ["prenderesti", "prendessi", "prendi"], 2, "Real condition: se + presente (tu prendi)."], ["Se l'inquinamento aumenta, i fiumi ___ più sporchi. (diventare, futuro)", "diventeranno", "diventare, futuro loro: diventeranno."]], "act": {"type": "speak", "items": [["Che cosa fai se piove nel fine settimana?", "What do you do if it rains at the weekend?"], ["Se domenica fa bel tempo, dove andrai?", "If the weather is nice on Sunday, where will you go?"], ["Che cosa fai se vedi qualcuno buttare la plastica per terra?", "What do you do if you see someone throw plastic on the ground?"]]}, "mission": ["Chiedi a un vicino o al portiere: «Se ho delle bottiglie di vetro, dove le butto?»", "Ask a neighbour or the caretaker: «If I have some glass bottles, where do I throw them?»"]}, {"n": 82, "review": false, "topic": "Periodo ipotetico tipo 2", "short": "Periodo ipotetico tipo 2", "theme": "viaggi dei sogni", "type": "tr", "cards": [["fare il giro del mondo", "to travel around the world"], ["la meta", "the destination"], ["l'isola deserta", "the desert island"], ["la crociera", "the cruise"], ["viaggiare con lo zaino in spalla", "to go backpacking"], ["l'avventura", "the adventure"], ["il tramonto", "the sunset"], ["esotico", "exotic"]], "hint": ["Se avessi tempo, viaggerei. · Se fossi ricco, farei una crociera.", "Se potessimo, andremmo in Giappone."], "ex": [["Se ___ più soldi, farei il giro del mondo. (avere, io)", "avessi", "Unreal condition: se + congiuntivo imperfetto (avessi)."], ["Se fossi in vacanza, ___ il tramonto ogni giorno. (guardare, io)", "guarderei", "Unreal condition: condizionale (guarderei)."], ["Se Luca ___ l'inglese, viaggerebbe da solo. (sapere)", "sapesse", "se + congiuntivo imperfetto: lui sapesse."], ["Se avessimo un mese libero, ___ in Australia.", ["andiamo", "andremmo", "andassimo"], 1, "se + congiuntivo imperfetto → condizionale: andremmo."], ["Se voi ___ su un'isola deserta, che cosa portereste? (essere)", "foste", "essere, congiuntivo imperfetto voi: foste."], ["Se i miei genitori fossero più giovani, ___ con lo zaino in spalla. (viaggiare)", "viaggerebbero", "condizionale loro: viaggerebbero."], ["Se ___ di più, potrei andare ai Caraibi.", ["guadagnassi", "guadagnerei", "guadagno"], 0, "With potrei: se + congiuntivo imperfetto (guadagnassi)."], ["Se tu ___ scegliere una meta, dove andresti? (potere)", "potessi", "potere, congiuntivo imperfetto tu: potessi."]], "act": {"type": "tr", "items": [["If I had time, I would travel more.", "Se avessi tempo, viaggerei di più."], ["If we were rich, we would go on a cruise.", "Se fossimo ricchi, faremmo una crociera."], ["Where would you go if you could choose?", "Dove andresti se potessi scegliere?"], ["If Sara spoke Spanish, she would live in Mexico.", "Se Sara parlasse spagnolo, vivrebbe in Messico."]]}, "mission": ["Davanti alla vetrina di un'agenzia di viaggi o al bar con un amico, chiedi: «Se potessi andare ovunque, dove andresti?» e rispondi anche tu.", "In front of a travel agency window or at the bar with a friend, ask: «If you could go anywhere, where would you go?» and answer too."]}, {"n": 83, "review": false, "topic": "Periodo ipotetico tipo 3", "short": "Periodo ipotetico tipo 3", "theme": "scelte di vita", "type": "write", "cards": [["la scelta", "the choice"], ["prendere una decisione", "to make a decision"], ["cambiare vita", "to change one's life"], ["il bivio", "the crossroads (in life)"], ["mettere su famiglia", "to start a family"], ["il destino", "fate"], ["rischiare", "to take a risk"], ["sistemarsi", "to settle down"]], "hint": ["Se avessi saputo, sarei venuto/a.", "Se Marco avesse studiato, avrebbe passato l'esame.", "Se fossimo partiti prima, saremmo arrivati in tempo."], "ex": [["Se ___ prima, avrei preso il treno. (uscire, io)", "fossi uscito|fossi uscita", "Past unreal condition: se + fossi uscito/a."], ["Se Marco avesse studiato di più, ___ la laurea. (prendere, condizionale passato)", "avrebbe preso", "se + congiuntivo trapassato → condizionale passato: avrebbe preso."], ["Se ___ quel lavoro a Londra, la mia vita sarebbe stata diversa. (accettare, io)", "avessi accettato", "se + congiuntivo trapassato: avessi accettato."], ["Se avessimo saputo dello sciopero, ___ a casa.", ["avremmo rimasto", "saremmo rimasti", "saremo rimasti"], 1, "rimanere takes essere: saremmo rimasti."], ["Se Giulia non ___ a Torino, non avrebbe conosciuto suo marito. (andare)", "fosse andata", "andare takes essere; Giulia → andata."], ["Se tu mi ___ la verità, ti avrei aiutato. (dire)", "avessi detto", "se + congiuntivo trapassato: tu avessi detto."], ["Se Paolo avesse rischiato di più, ___ più felice.", ["fosse stato", "sarebbe stato", "sarà stato"], 1, "Result in the past: condizionale passato (sarebbe stato)."], ["Se i miei nonni non ___ in Argentina, mio padre non sarebbe nato lì. (emigrare)", "fossero emigrati", "emigrare takes essere: fossero emigrati."]], "act": {"type": "write", "task": "Pensa a una scelta importante della tua vita (per esempio venire in Italia). Che cosa sarebbe successo se avessi fatto una scelta diversa? Scrivi almeno quattro frasi con «Se avessi…, avrei…» o «Se fossi…, sarei…».", "en": "Think of an important choice in your life (for example coming to Italy). What would have happened if you had made a different choice? Write at least four sentences with «If I had…, I would have…».", "target": "periodo ipotetico tipo 3: se + congiuntivo trapassato, condizionale passato", "words": "80–120"}, "mission": ["Racconta a un collega o a un amico al bar un piccolo «se» di questa settimana, per esempio: «Se avessi saputo dello sciopero, avrei preso la bici!»", "Tell a colleague or a friend at the bar about a small «if» from this week, for example: «If I had known about the strike, I would have taken the bike!»"]}, {"n": 84, "review": true, "topic": "Ripasso della settimana 12", "short": "Ripasso", "theme": "", "type": "write", "cards": [], "hint": [], "ex": [], "act": {"type": "write", "task": "Diario della settimana: che cosa avresti voluto fare questa settimana e non hai fatto? Che cosa faresti se avessi una settimana libera? C'è una scelta del passato che avresti fatto in modo diverso? Usa «Se avessi…, avrei…».", "en": "Diary of the week: what would you have liked to do this week but didn't? What would you do if you had a free week? Is there a choice from the past you would have made differently? Use «If I had…, I would have…».", "target": "condizionale passato, congiuntivo imperfetto, periodo ipotetico tipo 1, 2 e 3", "words": "80–120"}, "mission": ["Al bar o con un vicino, parlate di vacanze. Chiedi (con il Lei): «Se avesse un mese libero, dove andrebbe?» Poi rispondi anche tu con almeno tre frasi, per esempio: «Se potessi, andrei…», «L'anno scorso sarei andato in Sicilia, ma…», «Se avessi saputo…».", "At the bar or with a neighbour, talk about holidays. Ask (formally): «If you had a free month, where would you go?» Then answer too with at least three sentences, for example: «If I could, I would go…», «Last year I would have gone to Sicily, but…», «If I had known…»."]}, {"n": 85, "review": false, "topic": "Congiuntivo passato", "short": "Congiuntivo passato", "theme": "notizie personali", "type": "speak", "cards": [["Che novità ci sono?", "What's new?"], ["fidanzarsi", "to get engaged"], ["aspettare un bambino", "to be expecting a baby"], ["traslocare", "to move house"], ["la promozione", "the promotion"], ["lasciarsi", "to break up"], ["andare in pensione", "to retire"], ["Che bella notizia!", "What great news!"]], "hint": ["Penso che Marco abbia capito. · Spero che Anna sia arrivata.", "Credo che si siano lasciati."], "ex": [["Penso che Giulia ___ una promozione. (ricevere, passato)", "abbia ricevuto", "Past action: congiuntivo passato (abbia ricevuto)."], ["Credo che Marco e Sara ___ il mese scorso. (fidanzarsi)", "si siano fidanzati", "Reflexive verbs take essere: si siano fidanzati."], ["Spero che Anna ___ bene a Milano. (arrivare, passato)", "sia arrivata|sarà arrivata", "arrivare takes essere: sia arrivata (or futuro anteriore)."], ["Penso che i Rossi ___ ieri.", ["abbiano traslocato", "siano traslocati", "abbia traslocato"], 0, "traslocare takes avere; i Rossi = loro."], ["Credo che tuo padre ___ in pensione l'anno scorso. (andare)", "sia andato", "andare takes essere: sia andato."], ["Non credo che voi ___ la notizia. (leggere, passato)", "abbiate letto", "leggere → letto; voi: abbiate letto."], ["Penso che Luca e Marta ___.", ["si abbiano lasciati", "si siano lasciati", "si sia lasciato"] const $ = (s, r = document) => r.querySelector(s);

const LS_KEY = "quaderno-italiano-90-v1";
const ymd = t => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;
const fresh = () => ({ v:2, start: ymd(new Date()), days:{}, cards:{}, errs:{}, notes:[], fixed:0, updated:0 });

/* ---------- state: saved on this device, synced to your account on claude.ai ---------- */

try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch {}
const D = n => (S.days[n] ||= { done:{}, ex:{}, rx:{}, rev:null, tr:{}, trc:{}, write:"", wfb:null });
let dbRef = null, pushTimer = null, chain = Promise.resolve(), sync = "local";
function save(){
  S.updated = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {}
  clearTimeout(pushTimer); pushTimer = setTimeout(push, 1500);
  renderStats();
}
function push(){
  if (!dbRef) return;
  const body = JSON.parse(JSON.stringify(S));
  chain = chain.then(() => dbRef.set(body)).then(() => setSync("synced"), () => setSync("error"));
}
function setSync(s){ sync = s; renderStats(); }
async function connect(){
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    dbRef = db.doc("data/users/" + id + "/quaderno90");
    const snap = await dbRef.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.updated || 0) > (S.updated || 0)) {
      S = Object.assign(fresh(), JSON.parse(JSON.stringify(remote)));
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {}
      route();
    } else if ((S.updated || 0) > (remote?.updated || 0)) push();
    setSync("synced");
  } catch { setSync("error"); }
}

/* ---------- answer checking ---------- */
const norm = s => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s*'\s*/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?,;:]+$/, "").trim();
const bare = s => norm(s).normalize("NFD").replace(/[̀-ͯ]/g, "");
function grade(given, ans){
  const g = norm(given); if (!g) return null;
  const alts = ans.split("|");
  if (alts.some(a => norm(a) === g)) return "ok";
  if (alts.some(a => bare(a) === bare(g))) return "near";
  return "wrong";
}

  else { const t = todayN(); view = t >= 1 && t <= TOTAL ? { k:"day", n:t } : { k:"plan" }; }

}

/* ----- exercises (day, review and Errori views share this) ----- */
function itemHTML(ctx, n, i, it, res){
  const isMC = Array.isArray(it[1]), r = res?.r, data = `data-ctx="${ctx}" data-n="${n}" data-i="${i}"`;
  const from = ctx !== "d" ? `<span class="from">giorno ${n}</span>` : "";

    q = `${esc(qq).replace("___", "<b>___</b>")}${from}<div class="opts">${opts.map((o, k) => {
      const c = r ? (k === ok ? " right" : (res.g === k ? " chosen-wrong" : "")) : "";
      return `<button class="opt${c}" data-act="mc" ${data} data-o="${k}"${r ? " disabled" : ""}>${esc(o)}</button>`; }).join("")}</div>`;
    if (r === "ok") fb = `<span class="hand pen-green">giusto!</span>`;
    if (r === "wrong") fb = `<span class="hand pen-red">no</span><span>→ <b>${esc(opts[ok])}</b></span>${x ? `<span class="muted">${esc(x)}</span>` : ""}`;
  } else {
    const [qq, ans, x] = it, alts = ans.split("|"), size = Math.max(5, ...alts.map(a => a.length)) + 2;
    const input = `<input class="fill" id="in-${ctx}-${n}-${i}" ${data} size="${size}" value="${esc(res?.g || "")}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Risposta"${r ? " readonly" : ""}>`;
    const parts = esc(qq).split("___");
    q = (parts.length > 1 ? parts[0] + input + parts.slice(1).join("___") : esc(qq) + " " + input) + from;
    if (!r) q += ` <button class="btn small" data-act="check" ${data}>Controlla</button>`;
    if (r === "ok") fb = `<span class="hand pen-green">giusto!</span>${alts.length > 1 ? `<span class="muted">Anche: ${esc(alts.filter(a => norm(a) !== norm(res.g)).join(" / "))}</span>` : ""}`;
    if (r === "near") fb = `<span class="hand pen-blue">attento agli accenti</span><span>→ <b>${esc(alts.find(a => bare(a) === bare(res.g)) || alts[0])}</b></span>`;
    if (r === "wrong") fb = `<span class="hand pen-red">no</span><span>→ <b>${esc(alts.join(" / "))}</b></span>${x ? `<span class="muted">${esc(x)}</span>` : ""}`;
  }
  return `<li${r ? ` class="${r}"` : ""} id="li-${ctx}-${n}-${i}"><div class="q">${q}</div>${fb ? `<div class="fb-line">${fb}</div>` : ""}</li>`;
}
function answer(ctx, n, i, given, r){
  const key = `d${n}_${i}`, it = DAYS[n-1].ex[i];
  if (r === "wrong") S.errs[key] = { t: Date.now(), c: (S.errs[key]?.c || 0) + 1 };
  else if (S.errs[key]) { delete S.errs[key]; S.fixed = (S.fixed || 0) + 1; }
  let res, total, vals;
  if (ctx === "d") { const st = D(n); st.ex[i] = { r, g: given }; res = st.ex[i]; vals = Object.values(st.ex); total = it && DAYS[n-1].ex.length; if (vals.length === total) st.done.ex = true; }
  else if (ctx === "r") { const st = D(view.n); st.rx[key] = { r, g: given }; res = st.rx[key]; vals = Object.values(st.rx); total = st.rev.length; if (vals.length === total) st.done.ex = true; }
  else { errSnap[key] = { r, g: given }; res = errSnap[key]; }
  save();
  const li = $(`#li-${ctx}-${n}-${i}`); if (li) li.outerHTML = itemHTML(ctx, n, i, it, res);
  if (ctx !== "e") {
    const sc = $("#exscore"); if (sc) sc.textContent = `${vals.filter(v => v.r !== "wrong").length} su ${total} giuste`;
    if (D(view.n).done.ex) markDoneUI("ex", true);
    const next = [...document.querySelectorAll(`input.fill[data-ctx="${ctx}"]:not([readonly])`)][0]; if (next) next.focus();
  }
  renderTabs();
}
function checkFill(el){
  const { ctx, n, i } = el.dataset, r = grade(el.value, DAYS[n-1].ex[i][1]);
  if (!r) { el.focus(); return; }
  answer(ctx, +n, +i, el.value.trim(), r);
}
function markDoneUI(b, on){
  const sec = $("#b-" + b); if (!sec) return;
  sec.classList.toggle("isdone", on);
  const s = sec.querySelector(".status"); if (s) { s.textContent = on ? "✓ Fatto" : "Da fare"; s.classList.toggle("on", on); }
  const btn = sec.querySelector(".done-btn"); if (btn) { btn.textContent = on ? "✓ Fatto · annulla" : "Segna come fatto"; btn.classList.toggle("on", on); btn.setAttribute("aria-pressed", on); }

/* ----- review days: open mistakes first, then a stable random pick from the days before ----- */
function seeded(arr, seed){ const a = arr.slice(); let s = seed * 9301 + 49297; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function reviewKeys(n){
  const st = D(n); if (st.rev) return st.rev;
  const from = n === TOTAL ? 1 : Math.max(1, n - 6);
  const open = Object.keys(S.errs).filter(k => pk(k)[0] < n).sort((a, b) => S.errs[b].c - S.errs[a].c);
  const pool = DAYS.filter(d => d.n >= from && d.n < n && !d.review).flatMap(d => d.ex.map((_, i) => `d${d.n}_${i}`));
  const keys = open.slice(0, 8);
  for (const k of seeded(pool, n)) { if (keys.length >= 12) break; if (!keys.includes(k)) keys.push(k); }
  if (keys.length) { st.rev = keys; save(); }
  return keys;
}

/* ----- translation & writing feedback ----- */
function trFeedback(fb){
  if (!fb) return "";

  return `<div style="font-size:.92rem"><span class="hand pen-red">correzione</span> <b class="pen-red">${esc(fb.corretta)}</b>${fb.nota ? `<div class="muted">${esc(fb.nota)}</div>` : ""}</div>`;
}

Per ogni frase hai l'originale inglese, una soluzione modello (non l'unica possibile) e la risposta dello studente. Accetta qualsiasi traduzione corretta e naturale, anche se diversa dal modello. Ignora maiuscole e punteggiatura finale.
Rispondi SOLO con JSON valido in questo formato:

${JSON.stringify(todo)}`;
  try {

function addNote(n, wrong, right, why, kind){
  if (!wrong || !right || norm(wrong) === norm(right)) return;
  if (S.notes.some(x => norm(x.w) === norm(wrong) && norm(x.r) === norm(right))) return;
  S.notes.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), n, w: String(wrong), r: String(right), x: String(why || ""), k: kind });
  S.notes = S.notes.slice(0, 200);
}

/* ----- flashcards ----- */
const cardsOf = n => (DAYS[n-1].cards || []).map(([it, en], i) => ({ id: `c${n}_${i}`, it, en, n }));
const cardsBefore = n => DAYS.filter(d => d.n < n).flatMap(d => cardsOf(d.n));
const dueCards = n => cardsBefore(n).filter(c => S.cards[c.id] != null && S.cards[c.id] <= 2).sort((a, b) => S.cards[a.id] - S.cards[b.id]).slice(0, 12);
function reviewCards(n){
  const seen = cardsBefore(n).filter(c => S.cards[c.id] != null);
  let p = seen.filter(c => S.cards[c.id] <= 2);
  if (p.length < 12) { const ids = new Set(p.map(c => c.id)); p = p.concat(cardsBefore(n).filter(c => c.n > n - 7 && !ids.has(c.id))).slice(0, 24); }
  return p.slice(0, 30);
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function startPlayer(mode, arg){
  let q, label, n = null;
  if (mode === "day") { n = +arg; const d = DAYS[n-1]; q = d.review ? reviewCards(n) : [...cardsOf(n), ...dueCards(n)]; label = d.review ? "Ripasso" : "Giorno " + n; }
  else if (mode === "deck") { q = cardsOf(+arg); label = "Giorno " + arg; }
  else { q = DAYS.flatMap(d => cardsOf(d.n)).filter(c => S.cards[c.id] === 1); label = "Carte difficili"; }
  player = q.length ? { mode, n, label, q: shuffle(q), i: 0, show: false, yes: 0, no: 0, again: new Set(), dir: "en" } : { empty: true };
  drawPlayer();
}
function drawPlayer(){
  const box = $("#player"); if (!box || !player) return;
  const p = player;
  if (p.empty) { box.innerHTML = `<p class="empty">Nessuna carta da ripassare, per ora.</p>`; return; }
  if (p.done) { box.innerHTML = `<div class="fc"><p class="hand pen-green" style="font-size:2rem;margin:0">Finito!</p><p class="meta">${p.yes} sapute · ${p.no} da ripassare</p><button class="btn" data-act="fc-close">Chiudi</button></div>`; return; }
  const c = p.q[p.i], front = p.dir === "en" ? c.en : c.it, back = p.dir === "en" ? c.it : c.en;
  box.innerHTML = `<div class="fc">
    <div class="row"><span class="meta">${esc(p.label)} · ${p.i + 1}/${p.q.length}</span><button class="btn small" data-act="fc-dir">${p.dir === "en" ? "Inglese → italiano" : "Italiano → inglese"}</button></div>
    <div class="card"><div class="front">${esc(front)}</div>${p.show ? `<div class="back">${esc(back)}</div>` : ""}</div>
    ${p.show ? `<div class="row"><button class="btn" data-act="fc-no" style="color:var(--red)">Non ancora</button><button class="btn primary" data-act="fc-yes">Lo sapevo</button></div>`
      : `<button class="btn primary" data-act="fc-flip">Gira la carta</button><p class="meta" style="margin:0">Prima di' la risposta a voce alta, poi gira.</p>`}
  </div>`;
}
function fcAnswer(yes){
  const p = player, c = p.q[p.i];
  if (yes) { S.cards[c.id] = Math.min(5, (S.cards[c.id] ?? 1) + 1); p.yes++; }
  else { S.cards[c.id] = 1; p.no++; if (!p.again.has(c.id)) { p.again.add(c.id); p.q.push(c); } }
  p.i++; p.show = false;
  if (p.i >= p.q.length) { p.done = true; if (p.mode === "day") { D(p.n).done.vocab = true; markDoneUI("vocab", true); } }
  save(); drawPlayer();
}

      return `<details class="wk"${weekOf(t) === wi + 1 ? " open" : ""}><summary>Settimana ${wi+1} · ${esc(w)}</summary><div class="decks">${days.map(d => {
        const cs = cardsOf(d.n), sure = cs.filter(c => (S.cards[c.id] ?? 0) >= 3).length, seen = cs.filter(c => S.cards[c.id] != null).length;
        return `<div class="deck"><span class="eyebrow">Giorno ${d.n}</span><h3>${esc(d.theme)}</h3><span class="bar"><i style="width:${sure / cs.length * 100}%"></i></span>
          <span class="muted small">${sure} sicure · ${seen} viste di ${cs.length}</span><div><button class="btn small" data-act="fc-start" data-mode="deck" data-k="${d.n}">Studia</button></div></div>`;
      }).join("")}</div></details>`;
    }).join("")}`;
}

/* ----- errors view ----- */
function errView(){
  if (!errSnap) errSnap = Object.fromEntries(Object.keys(S.errs).map(k => [k, null]));
  const keys = Object.keys(errSnap).sort((a, b) => { const [an, ai] = pk(a), [bn, bi] = pk(b); return an - bn || ai - bi; });
  return `<section class="panel"><span class="eyebrow">Errori</span><h2>Il tuo quaderno degli errori</h2>
    <p class="muted">Qui finisce tutto quello che hai sbagliato. Un esercizio sparisce quando lo rifai giusto, qui o in un giorno di ripasso. Errori corretti finora: <b>${S.fixed || 0}</b>.</p></section>
  <section class="block"><div class="bhead"><div class="btitle"><h2>Esercizi da rifare</h2><p>${Object.keys(S.errs).length} aperti</p></div></div>
    <div class="bbody">${keys.length ? `<ol class="items">${keys.map(k => { const [n, i] = pk(k); return itemHTML("e", n, i, DAYS[n-1].ex[i], errSnap[k]); }).join("")}</ol>` : `<p class="empty">Nessun esercizio sbagliato. Bene così!</p>`}</div></section>
  <section class="block"><div class="bhead"><div class="btitle"><h2>Dai tuoi testi e dalle traduzioni</h2><p>Errori trovati da Claude. Rileggili nella forma corretta.</p></div></div>
    <div class="bbody">${S.notes.length ? `<ul class="notes">${S.notes.map(x => `<li><div><s class="muted">${esc(x.w)}</s> → <b class="pen-red">${esc(x.r)}</b>${x.x ? `<div class="muted small">${esc(x.x)}</div>` : ""}<div class="muted" style="font-size:.75rem">Giorno ${x.n} · ${esc(x.k)}</div></div><button class="btn small" data-act="note-del" data-id="${esc(x.id)}">Imparato</button></li>`).join("")}</ul>` : `<p class="empty">Ancora niente. Gli errori trovati da Claude nei tuoi testi appariranno qui.</p>`}</div></section>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, n = +el.dataset.n, i = +el.dataset.i;
  if (a === "done") { const st = D(n), b = el.dataset.b; st.done[b] = !st.done[b]; markDoneUI(b, st.done[b]); save(); }
  else if (a === "check") checkFill($(`#in-${el.dataset.ctx}-${n}-${i}`));
  else if (a === "mc") { const it = DAYS[n-1].ex[i], o = +el.dataset.o; answer(el.dataset.ctx, n, i, o, o === it[2] ? "ok" : "wrong"); }
  else if (a === "reset-ex") { D(n).ex = {}; D(n).done.ex = false; save(); render(); }
  else if (a === "ai-tr") aiTranslations(n);
  else if (a === "ai-write") aiWrite(n);
  else if (a === "fc-start") startPlayer(el.dataset.mode, el.dataset.mode === "deck" ? el.dataset.k : n);
  else if (a === "fc-flip") { player.show = true; drawPlayer(); }
  else if (a === "fc-yes") fcAnswer(true);
  else if (a === "fc-no") fcAnswer(false);
  else if (a === "fc-dir") { player.dir = player.dir === "en" ? "it" : "en"; player.show = false; drawPlayer(); }
  else if (a === "fc-close") { player = null; $("#player").innerHTML = ""; if (view.k === "vocab") render(); }
  else if (a === "note-del") { S.notes = S.notes.filter(x => x.id !== el.dataset.id); save(); render(); }
  else if (a === "timer") {
    const id = el.id;
    if (timers[id]) { clearInterval(timers[id]); delete timers[id]; el.classList.remove("run"); el.textContent = "▶ 1:00"; return; }
    let s = 60; el.classList.add("run"); el.textContent = "1:00";
    timers[id] = setInterval(() => {
      s--; el.textContent = s > 0 ? `0:${String(s).padStart(2, "0")}` : "✓ Fatto";
      if (s <= 0) {
        clearInterval(timers[id]); delete timers[id]; el.classList.remove("run");
        spoken.add(n + ":" + i);
        if (DAYS[n-1].act.items.every((_, k) => spoken.has(n + ":" + k)) && !D(n).done.act) { D(n).done.act = true; markDoneUI("act", true); save(); }
      }
    }, 1000);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("input.fill") && !e.target.readOnly) { e.preventDefault(); checkFill(e.target); }
});
let typeTimer = null;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.tr) { const [n, i] = t.dataset.tr.split(":"); D(n).tr[i] = t.value; }
  else if (t.dataset.write) { const n = t.dataset.write; D(n).write = t.value; const wc = $("#wc-" + n); if (wc) wc.textContent = wcount(t.value) + " parole"; }
  else return;
  clearTimeout(typeTimer); typeTimer = setTimeout(save, 600);
});
document.addEventListener("change", e => {
  if (e.target.id === "start" && /^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) { S.start = e.target.value; save(); render(); }
});
window.addEventListener("hashchange", route);
route();
connect();
</script>
