<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quaderno d'italiano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout: a squared-paper school notebook (quaderno a quadretti); one column of blocks, corrections in red and blue pen like an Italian teacher. */
:root{
  --paper:#f7f9fd; --grid:rgba(52,98,178,.09); --card:#ffffff; --ink:#18233d; --muted:#5a6681; --line:#dce3ef;
  --blue:#1d4ed8; --blue-soft:#e6edff; --red:#c62828; --red-soft:#fde8e8; --green:#16794c; --green-soft:#e3f4ec;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Caveat", "Bradley Hand", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1422; --grid:rgba(130,160,225,.07); --card:#151d2f; --ink:#e4eaf6; --muted:#97a3bb; --line:#26314a;
  --blue:#86a8ff; --blue-soft:#1b2747; --red:#ff7a72; --red-soft:#3a1d22; --green:#5ccf97; --green-soft:#132e25; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e1422; --grid:rgba(130,160,225,.07); --card:#151d2f; --ink:#e4eaf6; --muted:#97a3bb; --line:#26314a;
  --blue:#86a8ff; --blue-soft:#1b2747; --red:#ff7a72; --red-soft:#3a1d22; --green:#5ccf97; --green-soft:#132e25; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.home-link{font-size:.85rem;text-decoration:none}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--blue)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.hand{font-family:var(--hand);font-size:1.35em;line-height:1}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

header.top{padding-block:20px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
.brand h1{font-size:1.7rem;font-weight:700}
.brand h1 span{color:var(--red);font-family:var(--hand);font-size:1.15em;font-weight:600;margin-left:4px}
.stats{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--red)}
.pill{display:inline-block;min-width:1.4em;padding:0 6px;border-radius:99px;background:var(--red-soft);color:var(--red);font-size:.75rem;font-weight:600;text-align:center;margin-left:4px}
.sync{font-size:.75rem;color:var(--muted)}
main{padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--card)}
.btn.small{padding:4px 9px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{background:var(--blue-soft);border-radius:8px;padding:10px 14px;font-size:.9rem;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0;display:grid;gap:12px}
.panel p{margin:0;max-width:68ch}

/* plan */
.daytype{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:0;padding:0;list-style:none}
.daytype li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:.85rem}
.daytype b{display:block;font-size:.9rem}
.week{display:grid;gap:10px}
.week h2{font-size:1.05rem}
.week h2 span{font-family:var(--body);font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:5px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:var(--ink);min-height:96px}
.tile:hover{border-color:var(--blue)}
.tile .d{display:flex;justify-content:space-between;gap:4px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .t{font-size:.83rem;line-height:1.25;flex:1;font-weight:500}
.tile.today{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.tile.rev{background:var(--paper)}
.tile.full .t::after{content:" ✓";color:var(--green)}
.bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--green)}

/* day */
.dayhead{display:grid;gap:8px}
.dayhead h1{font-size:2rem}
.daynav{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.daynav a{text-decoration:none}
.dayprog{margin:4px 0 0;font-size:.9rem;max-width:70ch}
.block{background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.block.isdone{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.bhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.bnum{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;width:1.2em}
.btitle{flex:1;min-width:0}
.btitle h2{font-size:1.1rem}
.btitle p{margin:0;font-size:.82rem;color:var(--muted)}
.mins{font-size:.8rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.star{color:var(--red)}
.status{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.bbody{padding:16px 18px 18px;display:grid;gap:14px;min-width:0}
.bfoot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);font-size:.85rem}
.bfoot .muted{flex:1 1 240px;min-width:0}
.done-btn.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
details.aiuto{border:1px dashed var(--line);border-radius:8px;padding:6px 12px;font-size:.9rem}
details.aiuto summary{cursor:pointer;color:var(--blue);font-weight:500}
details.aiuto ul{margin:6px 0 2px;padding-left:1.1em;display:grid;gap:2px}

/* exercises */
ol.items{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:it}
ol.items>li{counter-increment:it;display:grid;grid-template-columns:2em 1fr;gap:4px 8px;padding:10px 12px;border-radius:8px;background:var(--paper)}
ol.items>li::before{content:counter(it);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
ol.items>li.ok{background:var(--green-soft)}
ol.items>li.wrong{background:var(--red-soft)}
ol.items>li.near{background:var(--blue-soft)}
.q{min-width:0;line-height:2}
.from{font-size:.72rem;color:var(--muted);margin-left:6px}
.q input.fill{border:none;border-bottom:2px solid var(--muted);background:transparent;padding:0 4px;margin:0 2px;min-width:5ch;max-width:100%;outline:none}
.q input.fill:focus{border-color:var(--blue)}
li.ok input.fill{border-color:var(--green);color:var(--green);font-weight:600}
li.wrong input.fill{border-color:var(--red);color:var(--red);text-decoration:line-through}
li.near input.fill{border-color:var(--blue);color:var(--blue)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;cursor:pointer}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:600}
.opt.chosen-wrong{border-color:var(--red);color:var(--red);text-decoration:line-through}
.fb-line{grid-column:2;font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.pen-red{color:var(--red)} .pen-blue{color:var(--blue)} .pen-green{color:var(--green)}
.score{font-weight:600;font-variant-numeric:tabular-nums}

/* activities */
.tr-item{display:grid;gap:6px;padding:12px;border-radius:8px;background:var(--paper)}
.en{font-weight:500}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 10px;resize:vertical;line-height:1.5}
textarea.write{min-height:180px}
input.line{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 10px}
.model{font-size:.92rem;color:var(--green)}
.fb{border-left:3px solid var(--red);padding:4px 0 4px 14px;display:grid;gap:10px}
.fb p{margin:0}
.fb .corrected{background:var(--paper);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.errs{margin:0;padding-left:1.2em;display:grid;gap:6px}
.errs li.grave::marker{color:var(--red)} .errs li.lieve::marker{color:var(--blue)}
.errs s{color:var(--muted)}
.errs .grave b{color:var(--red)} .errs .lieve b{color:var(--blue)}
.legend{font-size:.8rem;color:var(--muted)}
.ai-only{display:none} body[data-ai="yes"] .ai-only{display:revert}
.no-ai{display:none} body[data-ai="no"] .no-ai{display:revert}
.qs{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.qs li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--paper);border-radius:8px}
.qs li div{min-width:0}
.timer{font-variant-numeric:tabular-nums;min-width:5em;justify-content:center}
.timer.run{border-color:var(--red);color:var(--red)}
.mission{font-size:1.05rem;max-width:65ch;margin:0}

/* flashcards */
.fc{display:grid;gap:12px;justify-items:center;padding:6px 0}
.card{width:100%;max-width:440px;min-height:160px;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center;padding:20px;text-align:center;gap:8px}
.card .front{font-size:1.25rem;font-weight:500}
.card .back{font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--blue)}
.fc .meta{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.deck{display:grid;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.deck h3{font-size:.95rem}
details.wk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.wk summary{cursor:pointer;font-family:var(--display);font-weight:500}
details.wk[open] summary{margin-bottom:10px}

/* errori */
.notes{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.notes li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 12px;background:var(--paper);border-radius:8px}
.notes li div{min-width:0}
.empty{text-align:center;padding:30px 10px;color:var(--muted);margin:0}

@media (max-width:560px){
  .dayhead h1{font-size:1.6rem}
  .bhead{padding:12px 14px} .bbody{padding:14px} .bfoot{padding:12px 14px}
  ol.items>li{grid-template-columns:1.6em 1fr}
  .mins{display:none}
}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <a class="home-link" href="../">← Il mio italiano</a>
  <div class="brand">
    <h1>Quaderno d'italiano<span>90 giorni</span></h1>
    <div class="stats" id="stats"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
const WEEKS = ["essere, avere, articoli", "il presente", "preposizioni, ora, routine", "negazione, stare + gerundio, passato prossimo", "imperfetto", "pronomi", "futuro, partitivo, ci e ne", "confronti, condizionale, Lei, imperativo", "imperativo, relativi, trapassato, futuro anteriore", "pronomi combinati, ci e ne idiomatici, connettivi", "congiuntivo presente", "condizionale passato, congiuntivo imperfetto, periodo ipotetico", "verso il B1"];
const DAYS = [{"n": 1, "review": false, "topic": "Essere + nazionalità", "short": "Essere + nazionalità", "theme": "saluti e presentazioni", "type": "speak", "cards": [["Buongiorno!", "Good morning! / Hello!"], ["Buonasera!", "Good evening!"], ["Ciao!", "Hi! / Bye!"], ["Arrivederci!", "Goodbye!"], ["Piacere!", "Nice to meet you!"], ["Come ti chiami?", "What's your name?"], ["Di dove sei?", "Where are you from?"], ["A presto!", "See you soon!"]], "hint": ["io sono · tu sei · lui/lei è", "noi siamo · voi siete · loro sono", "Marco è italiano · Anna è italiana"], "ex": [["Io ___ inglese. (essere)", "sono", "essere: io sono."], ["Tu ___ di Roma? (essere)", "sei", "essere: tu sei."], ["Marco ___ italiano. (essere)", "è", "essere: lui è, with the accent."], ["Noi ___ a Milano. (essere)", "siamo", "essere: noi siamo."], ["Voi ___ spagnoli? (essere)", "siete", "essere: voi siete."], ["Giulia e Sara ___ di Napoli.", ["è", "sono", "siete"], 1, "Two people (loro) → sono."], ["Anna è ___.", ["italiano", "italiana", "italiani"], 1, "Anna is a woman → italiana."], ["Paul e John sono ___. (inglese)", "inglesi", "inglese → plural inglesi."]], "act": {"type": "speak", "items": [["Come ti chiami?", "What's your name?"], ["Di dove sei?", "Where are you from?"], ["Di che nazionalità sei?", "What nationality are you?"]]}, "mission": ["Saluta un vicino o un collega e presentati in italiano: «Buongiorno! Piacere, sono [nome]. Sono [nazionalità].»", "Greet a neighbour or a colleague and introduce yourself in Italian: «Good morning! Nice to meet you, I'm [name]. I'm [nationality].»"]}, {"n": 2, "review": false, "topic": "Avere + età, avere fame/sete/freddo", "short": "Avere + età, avere fame/sete/freddo", "theme": "famiglia", "type": "tr", "cards": [["la madre", "the mother"], ["il padre", "the father"], ["il fratello", "the brother"], ["la sorella", "the sister"], ["il marito", "the husband"], ["la moglie", "the wife"], ["il figlio", "the son"], ["la figlia", "the daughter"]], "hint": ["io ho · tu hai · lui/lei ha · noi abbiamo · voi avete · loro hanno", "Ho 30 anni. · Ho fame. · Hai sete? · Ha freddo."], "ex": [["Io ___ 30 anni. (avere)", "ho", "avere: io ho (the h is silent)."], ["Tu ___ fratelli? (avere)", "hai", "avere: tu hai."], ["Laura ___ 25 anni. (avere)", "ha", "avere: lei ha."], ["Noi ___ fame. (avere)", "abbiamo", "avere: noi abbiamo."], ["Voi ___ sete? (avere)", "avete", "avere: voi avete."], ["I bambini ___ freddo. (avere)", "hanno", "Plural subject (loro) → hanno."], ["Quanti anni ___ Paolo?", ["è", "ha", "hai"], 1, "Age uses avere: Paolo ha 40 anni."], ["Io ___ freddo.", ["è", "ho", "ha"], 1, "Feeling cold uses avere: io ho freddo."]], "act": {"type": "tr", "items": [["I am 30 years old.", "Ho 30 anni."], ["Are you cold?", "Hai freddo?"], ["Anna has two brothers.", "Anna ha due fratelli."], ["We are hungry and thirsty.", "Abbiamo fame e sete."]]}, "mission": ["In pausa, chiedi a un collega o a un amico: «Hai fame? Hai sete?». Poi al bar ordina: «Ho sete. Un'acqua, per favore.»", "On a break, ask a colleague or a friend: «Are you hungry? Are you thirsty?». Then order at the bar: «I'm thirsty. A water, please.»"]}, {"n": 3, "review": false, "topic": "Articoli determinativi", "short": "Articoli determinativi", "theme": "casa e oggetti", "type": "write", "cards": [["la cucina", "the kitchen"], ["il bagno", "the bathroom"], ["la camera da letto", "the bedroom"], ["il divano", "the sofa"], ["lo specchio", "the mirror"], ["l'armadio", "the wardrobe"], ["la finestra", "the window"], ["le chiavi", "the keys"]], "hint": ["il divano · lo specchio · lo zaino · la porta · l'armadio", "i divani · gli specchi · gli armadi · le porte"], "ex": [["___ divano è nuovo. (the)", "il", "Masculine before a consonant → il."], ["___ cucina è grande. (the)", "la", "Feminine before a consonant → la."], ["___ specchio è in bagno. (the)", "lo", "Masculine before s + consonant → lo."], ["___ armadio è in camera. (the)", "l'", "Before a vowel → l'."], ["Dove sono __ o, fai una piccola conversazione sul tempo: «Stamattina faceva proprio freddo, eh?» oppure «Stamattina c'era la nebbia!».", "At the bar or in the lift with a neighbour, make small talk about the weather: «It was really cold this morning, eh?» or «There was fog this morning!»."]}, {"n": 33, "review": false, "topic": "Imperfetto o passato prossimo?", "short": "Imperfetto o passato prossimo?", "theme": "vestiti", "type": "tr", "cards": [["il cappotto", "coat"], ["la giacca", "jacket"], ["la camicia", "shirt"], ["i pantaloni", "trousers"], ["la gonna", "skirt"], ["il maglione", "jumper, sweater"], ["le scarpe", "shoes"], ["la taglia", "size (clothes)"]], "hint": ["Ogni inverno portavo il cappotto rosso. (abitudine)", "Ieri ho comprato un cappotto nuovo. (una volta)"], "ex": [["Da ragazza, ogni domenica mia madre ___ la gonna lunga. (mettere)", "metteva|si metteva", "Ogni domenica = habit → imperfetto (also: si metteva)."], ["Ieri pomeriggio Luca ___ un maglione blu in centro. (comprare)", "ha comprato|si è comprato", "One action, ieri pomeriggio → passato prossimo."], ["Sabato scorso io ___ tre paia di pantaloni, ma nessuno andava bene. (provare)", "ho provato|mi sono provato|mi sono provata", "One completed action → passato prossimo."], ["Quando abitavo a Milano, di solito ___ il cappotto da novembre a marzo.", ["mettevo", "ho messo", "metto"], 0, "Di solito = habit in the past → imperfetto."], ["All'improvviso Marta ___ la giacca ed è uscita. (prendere)", "ha preso", "All'improvviso = one sudden action → passato prossimo."], ["Da bambino, mio fratello ___ le scarpe da ginnastica tutti i giorni. (portare)", "portava", "Tutti i giorni = habit → imperfetto."], ["Ieri sera ___ la camicia bianca per la cena con i colleghi.", ["ho messo", "mettevo", "metto"], 0, "Ieri sera, one time → passato prossimo."], ["Un anno fa, in un negozio di Firenze, Sara ___ una gonna bellissima, ma non c'era la sua taglia. (vedere)", "ha visto", "One event → passato prossimo; c'era describes the situation."]], "act": {"type": "tr", "items": [["When I was a child, I always wore jeans.", "Da bambino portavo sempre i jeans. (Da bambina…)"], ["Yesterday I bought a new coat.", "Ieri ho comprato un cappotto nuovo."], ["Every winter my father wore a grey jumper.", "Ogni inverno mio padre portava un maglione grigio."], ["Last Saturday Anna tried on a skirt, but the size was wrong.", "Sabato scorso Anna ha provato una gonna, ma la taglia era sbagliata."]]}, "mission": ["In un negozio di vestiti, chiedi: «Avete questo maglione nella taglia M?» Poi scrivi un messaggio a un amico: «Oggi ho provato un maglione, ma era troppo piccolo».", "In a clothes shop, ask: «Do you have this jumper in size M?» Then text a friend: «Today I tried on a jumper, but it was too small»."]}, {"n": 34, "review": false, "topic": "Mentre + imperfetto, quando + passato prossimo", "short": "Mentre + imperfetto, quando + passato…", "theme": "descrivere persone (personalità)", "type": "write", "cards": [["il carattere", "personality, character"], ["timido", "shy"], ["generoso", "generous"], ["pigro", "lazy"], ["testardo", "stubborn"], ["allegro", "cheerful"], ["chiacchierone", "chatty, talkative"], ["permaloso", "touchy, easily offended"]], "hint": ["Mentre cucinavo, è arrivato Marco.", "Quando sono uscito, pioveva."], "ex": [["Mentre Paolo ___ la TV, è arrivata sua moglie. (guardare)", "guardava|stava guardando", "Mentre + ongoing action → imperfetto."], ["Mentre facevo la spesa, ___ la mia vicina. (incontrare, io)", "ho incontrato", "The action that happens → passato prossimo."], ["Ieri sera, quando Giulia ___ a casa, i bambini dormivano già. (arrivare)", "è arrivata", "Quando + one event → passato prossimo; arrivare takes essere."], ["Mentre ___ al lavoro, ho visto un incidente.", ["andavo", "sono andato", "vado"], 0, "Mentre + background action → imperfetto."], ["Ieri, mentre noi ___ in centro, ha cominciato a piovere. (passeggiare)", "passeggiavamo|stavamo passeggiando", "Mentre + ongoing action → imperfetto."], ["Quando ho conosciuto Luca, lui ___ molto timido. (essere)", "era", "Description of a person → imperfetto."], ["Ieri mattina, quando Sara ___, c'era il sole.", ["si è alzata", "si alzava", "si alza"], 0, "One event yesterday → passato prossimo."], ["Mentre la professoressa ___, Marco chiacchierava con il compagno di banco. (spiegare)", "spiegava|stava spiegando", "Two actions in progress at the same time → both imperfetto."]], "act": {"type": "write", "task": "Descrivi il carattere di un amico o di un'amica. Poi racconta il vostro primo incontro: dove eravate, che cosa facevate, che cosa è successo.", "en": "Describe the personality of a friend. Then tell the story of your first meeting: where you were, what you were doing, what happened.", "target": "mentre + imperfetto, quando + passato prossimo; aggettivi di carattere", "words": "50–80"}, "mission": ["Al lavoro o al bar, racconta a qualcuno una piccola cosa di oggi con «mentre»: «Mentre venivo qui, ho visto…».", "At work or at the bar, tell someone a small thing that happened today using «mentre»: «While I was coming here, I saw…»."]}, {"n": 35, "review": true, "topic": "Ripasso della settimana 5", "short": "Ripasso", "theme": "", "type": "write", "cards": [], "hint": [], "ex": [], "act": {"type": "write", "task": "Diario della settimana: scrivi che cosa hai fatto questa settimana. Poi racconta un ricordo di quando eri piccolo o piccola: dove abitavi, che tempo faceva, che cosa facevi d'estate.", "en": "Diary of the week: write what you did this week. Then tell a memory from when you were little: where you lived, what the weather was like, what you did in summer.", "target": "passato prossimo e imperfetto; mentre / quando", "words": "50–80"}, "mission": ["Con un vicino, un collega o il barista, fai una piccola conversazione sul passato. Racconta dove abitavi da piccolo (piccola) e che tempo faceva, poi chiedi: «E tu, dove abitavi da piccolo? Com'era la tua città?» Fai almeno un'altra domanda.", "With a neighbour, a colleague or the barista, have a short conversation about the past. Say where you lived as a child and what the weather was like, then ask: «And you, where did you live as a child? What was your town like?» Ask at least one more question."]}, {"n": 36, "review": false, "topic": "Pronomi diretti lo, la, li, le", "short": "Pronomi diretti lo, la, li, le", "theme": "spesa e supermercato", "type": "speak", "cards": [["il carrello", "shopping trolley"], ["lo scaffale", "shelf"], ["il reparto", "section, aisle (in a shop)"], ["in offerta", "on special offer"], ["i surgelati", "frozen food"], ["il detersivo", "detergent"], ["la carta fedeltà", "loyalty card"], ["la busta", "shopping bag"]], "hint": ["Il latte? Lo prendo io. · La pasta? La compro qui.", "I pomodori? Li prendo. · Le uova? Le compro domani."], "ex": [["Il pane? ___ compro sempre al supermercato. (pronome)", "Lo", "il pane = masculine singular → lo."], ["La carta fedeltà? ___ porto sempre con me. (pronome)", "La", "la carta = feminine singular → la."], ["Gli spaghetti? ___ cucino stasera. (pronome)", "Li", "gli spaghetti = masculine plural → li."], ["Le mele? Marco ___ compra al mercato.", ["le", "li", "la"], 0, "le mele = feminine plural → le."], ["Il detersivo? Non ___ trovo. In che reparto è? (pronome)", "lo", "il detersivo = masculine singular → lo, after non."], ["Vedi lo scaffale dei surgelati? — Sì, ___ vedo.", ["lo", "la", "li"], 0, "lo scaffale = masculine singular → lo."], ["Le bottiglie d'acqua? Marco ___ mette nel carrello. (pronome)", "le", "le bottiglie = feminine plural → le."], ["I biscotti in offerta? Io non ___ prendo mai. (pronome)", "li", "i biscotti = masculine plural → li."]], "act": {"type": "speak", "items": [["Il pane, lo compri al supermercato o in panetteria?", "Bread: do you buy it at the supermarket or at the bakery?"], ["La frutta, la prendi al mercato o al supermercato?", "Fruit: do you get it at the market or at the supermarket?"], ["Usi la carta fedeltà al supermercato?", "Do you use a loyalty card at the supermarket?"]]}, "mission": ["Al supermercato, chiedi a un commesso dove trovi una cosa, con un pronome: «Buongiorno, il detersivo dove lo trovo?»", "At the supermarket, ask a shop assistant where to find something, using a pronoun: «Good morning, where can I find the detergent?»"]}, {"n": 37, "review": false, "topic": "Pronomi diretti mi, ti, ci, vi + con i modali", "short": "Pronomi diretti mi, ti, ci, vi + con i…", "theme": "aiutare e chiedere aiuto", "type": "tr", "cards": [["dare una mano", "to give a hand"], ["accompagnare", "to go with, to take (someone somewhere)"], ["venire a prendere", "to pick up (someone)"], ["riparare", "to repair"], ["spiegare", "to explain"], ["il trasloco", "house move"], ["l'idraulico", "plumber"], ["Grazie dell'aiuto!", "Thanks for the help!"]], "hint": ["Marco mi aiuta · Ti chiamo stasera · Ci aspetti? · Vi accompagno", "Ti posso aiutare? = Posso aiutarti?"], "ex": [["Marco, ___ accompagni alla stazione? (io)", "mi", "Direct pronoun for io → mi."], ["Ragazzi, ___ aspettiamo al bar alle otto. (voi)", "vi", "Direct pronoun for voi → vi."], ["Non ___ capisco quando parli veloce. (tu)", "ti", "Direct pronoun for tu → ti, after non."], ["Mia sorella ___ viene a prendere alla stazione. (noi)", ["ci", "vi", "mi"], 0, "Direct pronoun for noi → ci."], ["Posso ___ con il trasloco? (aiutare + ti)", "aiutarti", "Pronoun after the infinitive is attached: aiutar + ti."], ["Domani ___ voglio accompagnare dal medico. (tu)", "ti", "Pronoun before the modal: ti voglio accompagnare."], ["Scusa, puoi ___? Il computer non funziona.", ["aiutarmi", "aiutami", "mi aiutare"], 0, "potere + infinitive + attached pronoun: aiutarmi."], ["Laura e Paolo, oggi non posso ___ in macchina. (portare + vi)", "portarvi", "Pronoun attached to the infinitive: portar + vi."]], "act": {"type": "tr", "items": [["Can you help me?", "Mi puoi aiutare? (Puoi aiutarmi?)"], ["I'll wait for you at the bar.", "Ti aspetto al bar."], ["Our neighbour helps us with the move.", "Il nostro vicino ci aiuta con il trasloco."], ["Can I walk you home? (to two friends)", "Vi posso accompagnare a casa? (Posso accompagnarvi a casa?)"]]}, "mission": ["Al lavoro o a casa, chiedi aiuto a un collega o a un vicino: «Mi puoi aiutare un attimo?» Oppure offri tu aiuto: «Ti posso aiutare?»", "At work or at home, ask a colleague or a neighbour for help: «Can you help me for a moment?» Or offer help yourself: «Can I help you?»"]}, {"n": 38, "review": false, "topic": "Pronomi indiretti mi, ti, gli, le, ci, vi", "short": "Pronomi indiretti mi, ti, gli, le, ci, vi", "theme": "regali e feste", "type": "write", "cards": [["regalare", "to give as a present"], ["fare gli auguri", "to wish someone well (birthday, holidays)"], ["il pacchetto regalo", "gift wrapping"], ["il biglietto di auguri", "greeting card"], ["l'anniversario", "anniversary"], ["il brindisi", "toast (with drinks)"], ["la sorpresa", "surprise"], ["festeggiare", "to celebrate"]], "hint": ["A Marco? Gli regalo un libro. · A Sara? Le regalo un profumo.", "mi scrive · ti porto · ci offre · vi dico"], "ex": [["Sara, quando torno da Roma ___ porto un regalo! (a te)", "ti", "a te → ti."], ["È il compleanno di Luca: ___ regalo un libro. (a Luca)", "gli", "a lui → gli."], ["Ragazzi, ___ offro io da bere! (a voi)", "vi", "a voi → vi."], ["Il nonno ___ manda sempre un biglietto di auguri. (a noi)", "ci", "a noi → ci."], ["Anna compie trent'anni: ___ facciamo una sorpresa.", ["le", "la", "gli"], 0, "fare una sorpresa a lei → le."], ["Al compleanno di Francesca ___ facciamo gli auguri tutti insieme. (a Francesca)", "le", "a lei → le."], ["Questi regali ___ piacciono molto, grazie! (a me)", ["mi", "me", "io"], 0, "a me → mi; plural regali → piacciono."], ["Domenica è l'anniversario dei miei genitori: ___ regaliamo una cena al ristorante. (ai miei genitori)", "gli", "a loro → gli before the verb."]], "act": {"type": "write", "task": "Si avvicina una festa (Natale, cuno: direct, feminine → la."], ["Sara mi ha mandato un messaggio vocale: ___ rispondo dopo. (a Sara)", "le", "rispondere a qualcuno: indirect → le."]], "act": {"type": "speak", "items": [["Quando un amico ti manda un messaggio vocale, gli rispondi subito?", "When a friend sends you a voice message, do you reply to him right away?"], ["Telefoni spesso ai tuoi genitori?", "Do you often phone your parents?"], ["Il caricabatterie, lo porti sempre con te?", "Do you always carry your charger with you?"]]}, "mission": ["Scrivi un messaggio a un amico o a una collega: «Ti chiamo più tardi, va bene?» Poi chiama davvero! Se non risponde, lascia un messaggio in segreteria: «Ciao, sono io. Ti richiamo stasera».", "Text a friend or a colleague: «I'll call you later, OK?» Then really call! If they don't answer, leave a voicemail: «Hi, it's me. I'll call you back tonight»."]}, {"n": 40, "review": false, "topic": "Pronomi + passato prossimo", "short": "Pronomi + passato prossimo", "theme": "lavoro", "type": "tr", "cards": [["la riunione", "meeting"], ["il capo", "boss"], ["lo stipendio", "salary"], ["il colloquio", "job interview"], ["il contratto", "contract"], ["il turno", "shift"], ["il curriculum", "CV"], ["fare gli straordinari", "to work overtime"]], "hint": ["Il contratto? L'ho firmato. · La mail? L'ho letta.", "I documenti? Li ho presi. · Le fotocopie? Le ho fatte.", "Al capo? Gli ho scritto. · A Sara? Le ho telefonato."], "ex": [["Il contratto? ___ firmato ieri. (pronome + avere, io)", "L'ho", "lo + ho → l'ho."], ["La mail del capo? Sì, l'ho già ___. (leggere)", "letta", "l'ho = la ho → participle agrees: letta."], ["I documenti? Li ho ___ sulla scrivania. (mettere)", "messi", "li → participle agrees: messi."], ["Le colleghe nuove? Non ___ ancora conosciute.", ["le ho", "l'ho", "li ho"], 0, "Feminine plural → le ho (le is not elided)."], ["Al capo? ___ ho scritto stamattina. (pronome)", "Gli", "scrivere a lui → gli; no agreement with indirect pronouns."], ["Le fotocopie? ndizionale)", "avrebbe", "Lei, condizionale: avrebbe."], ["Noi ___ ordinare, per favore. (volere, condizionale)", "vorremmo", "Noi, condizionale: vorremmo (double m)."], ["Scusi, mi ___ un'altra forchetta?", ["darei", "darerebbe", "darebbe"], 2, "Lei, condizionale of dare: darebbe."], ["Ragazzi, che cosa ___ bere?", ["vorreste", "vorrebbero", "vorresti"], 0, "Ragazzi = voi → vorreste."], ["___ possibile avere un tavolo fuori? (essere, condizionale)", "sarebbe", "Polite: sarebbe possibile…?"], ["Ci ___ il conto, per favore? (portare, Lei, condizionale)", "porterebbe", "Lei, condizionale: porterebbe."]], "act": {"type": "write", "task": "Scrivi un dialogo al ristorante tra te e il cameriere: prenoti un tavolo, ordini un primo e un secondo e chiedi il conto in modo gentile.", "en": "Write a dialogue at a restaurant between you and the waiter: you book a table, order a first and a main course and ask for the bill politely.", "target": "condizionale di cortesia: vorrei, potrebbe, avrebbe", "words": "50–80"}, "mission": ["Al bar ordina con il condizionale: «Vorrei un caffè, per favore.» Poi chiedi gentilmente: «Potrebbe darmi un bicchiere d'acqua?»", "At the bar, order using the conditional: 'I'd like a coffee, please.' Then ask politely: 'Could you give me a glass of water?'"]}, {"n": 53, "review": false, "topic": "Condizionale per consigli e desideri", "short": "Condizionale per consigli e desideri", "theme": "salute (farmacia, medico)", "type": "speak", "cards": [["il medico di base", "the GP (family doctor)"], ["la ricetta medica", "the prescription"], ["il mal di gola", "the sore throat"], ["la tosse", "the cough"], ["lo sciroppo", "the syrup"], ["la pastiglia", "the tablet"], ["la tessera sanitaria", "the health card"], ["il pronto soccorso", "the emergency room"]], "hint": ["Dovresti riposare. · Potresti prendere uno sciroppo.", "Mi piacerebbe dormire di più. · Sarebbe bello andare al mare.", "io dovrei · tu dovresti · lui dovrebbe · voi dovreste · andare → andrei"  Ha…?", "Ti piace? → Le piace? · Come ti chiami? → Come si chiama?", "Scusa! → Scusi! · Ti do… → Le do…"], "ex": [["Signora, Lei ___ italiana? (essere)", "è", "Lei takes the lui/lei form: è."], ["Scusi, ___ un documento? (avere, Lei)", "ha", "Lei → ha."], ["Signora, come ___? (chiamarsi, Lei)", "si chiama", "Lei → si chiama."], ["Dottore, ___ piace lavorare qui?", ["Ti", "La", "Le"], 2, "Formal with piacere: Le piace."], ["Signore, ___ compilare questo modulo. (dovere, Lei, presente)", "deve", "Lei → deve."], ["Signora, mi ___, dov'è lo sportello 3?", ["scusi", "scusa", "scusate"], 0, "Formal, one person: mi scusi."], ["Signor Bianchi, ___ firmare qui, per favore? (potere, Lei, presente)", "può", "Lei → può."], ["Signora, da dove ___? (venire, Lei, presente)", "viene", "Lei → viene."]], "act": {"type": "tr", "items": [["Excuse me, are you Mr Conti?", "Scusi, Lei è il signor Conti?"], ["Do you have your tax code? (formal)", "Ha il codice fiscale?"], ["Can you sign here, please? (formal)", "Può firmare qui, per favore? (Potrebbe firmare qui?)"], ["Do you like living in Italy? (formal)", "Le piace vivere in Italia?"]]}, "mission": ["Alla posta, in banca o in comune, usa il Lei con l'impiegato: «Scusi, dove prendo il numerino?» oppure «Scusi, dove devo firmare?»", "At the post office, the bank or the town hall, use Lei with the clerk: 'Excuse me, where do I get a queue ticket?' or 'Excuse me, where do I need to sign?'"]}, {"n": 55, "review": false, "topic": "Imperativo tu / voi", "short": "Imperativo tu / voi", "theme": "istruzioni e ricette", "type": "write", "cards": [["mescolare", "to stir"], ["versare", "to pour"], ["aggiungere", "to add"], ["tagliare a pezzetti", "to cut into small pieces"], ["scolare la pasta", "to drain the pasta"], ["spegnere il fuoco", "to turn off the heat"], ["Attenzione!", "Careful!"], ["le istruzioni", "the instructions"]], "hint": ["girare → (tu) gira! · (voi) girate!", "prendere → (tu) prendi! · (voi) prendete! · finire → finisci!", "non pronome relativo)", "che", "che = who, referring to 'un vicino'."], ["È un oggetto ___ serve per aprire le bottiglie.", ["che", "chi", "cosa"], 0, "che links back to 'un oggetto'."], ["Il coltello che ___ sul tavolo è appuntito. (essere, presente)", "è", "il coltello è → che è."], ["Questa è la tazza ___ uso ogni mattina. (pronome relativo)", "che", "che also works as object: the cup (that) I use."], ["Le mele che ___ al mercato sono buonissime. (comprare, noi, presente)", "compriamo", "noi compriamo: the verb after che agrees with its own subject."], ["Il libro che mi ___ a Natale è bellissimo. (regalare, tu, passato prossimo)", "hai regalato", "tu hai regalato: che = the book (that) you gave me."], ["Ti piace il vaso di vetro che ___ Giulia? (portare, passato prossimo)", "ha portato", "Giulia ha portato: the subject can come after the verb."], ["Il ragazzo ___ ho visto ieri è il fratello di Anna.", ["chi", "dove", "che"], 2, "che = the boy (whom) I saw; chi isn't used after a noun."]], "act": {"type": "write", "task": "Descrivi tre oggetti che usi ogni giorno a casa: com'è, di che materiale è e a cosa serve.", "en": "Describe three objects you use every day at home: what it looks like, what it's made of and what it's used for.", "target": "pronome relativo che (l'oggetto che uso, una cosa che serve per…)", "words": "50–80"}, "mission": ["In un negozio di casalinghi o al mercato, chiedi un oggetto senza dire il nome: «Cerco una cosa che serve per…». Come si chiama?", "In a household-goods shop or at the market, ask for an object without saying its name: 'I'm looking for a thing that's used for…'. What is it called?"]}, {"n": 60, "review": false, "topic": "Cui dopo preposizione", "short": "Cui dopo preposizione", "theme": "casa e affitto", "type": "speak", "cards": [["il padrone di casa", "the landlord"], ["l'inquilino", "the tenant"], ["la caparra", "the deposit"], ["il contratto d'affitto", "the rental contract"], ["le spese condominiali", "the building service charges"], ["il bilocale", "the two-room flat"], ["ammobiliato", "furnished"], ["Affittasi", "For rent (sign)"]], "hint": ["la città in cui vivo · l'amico con cui esco", "la casa di cui ti parlo · la ragione per cui cerco casa"], "ex": [["La città in ___ vivo è Bologna. (pronome relativo)", "cui", "After a preposition use cui: in cui."], ["Il padrone di casa ___ cui parlo ogni mese è molto gentile. (with)", "con", "with = con → con cui."], ["Ecco il bilocale ___ cui ti ho parlato. (about)", "di", "parlare di → di cui."], ["La ragazza ___ cui ho dato le chiavi è la nuova inquilina. (to)", "a", "dare a qualcuno → a cui."], ["Il palazzo ___ abitiamo è del 1900.", ["in cui", "in che", "che"], 0, "Preposition + cui: in cui, never in che."], ["Il motivo ___ cerco casa è il lavoro.", ["di cui", "per che", "per cui"], 2, "il motivo per cui = the reason why."], ["Questa è la ragazza con cui ___ ieri sera. (uscire, io, passato prossimo)", "sono uscito|sono uscita", "uscire takes essere: sono uscito or sono uscita."], ["Il contratto ___ cui abbiamo bisogno è pronto. (preposizione)", "di", "avere bisogno di → di cui."]], "act": {"type": "speak", "items": [["Com'è la città in cui vivi adesso?", "What is the town you live in now like?"], ["Chi è la persona con cui parli più spesso in italiano?", "Who is the person you speak Italian with most often?"], ["Com'è la casa in cui abiti? C'è qualcosa di cui hai bisogno?", "What's the home you live in like? Is there anything you need?"]]}, "mission": ["Leggi un cartello «Affittasi» in strada o un annuncio in un'agenzia e descrivi la casa a un amico: «È un bilocale in cui…, in una zona in cui…»", "Read a 'For rent' sign in the street or an ad in an estate agency and describe the flat to a friend: 'It's a two-room flat in which…, in an area where…'"]}, {"n": 61, "review": false, "topic": "Trapassato prossimo", "short": "Trapassato prossimo", "theme": "trasporti e ritardi", "type": "tr", "cards": [["la coincidenza", "the connection (train, bus)"], ["soppresso", "cancelled (train)"], ["lo sciopero", "the strike"], ["il tabellone", "the departures board"], ["convalidare il biglietto", "to validate the ticket"], ["il capotreno", "the train conductor"], ["fare in tempo", "to make it in time"], ["la multa", "the fine"]], "hint": ["Quando sono arrivato/a, il treno era già partito.", "avevo comprato · ero uscito/a · ci eravamo svegliati"], "ex": [["Quando sono arrivata alla fermata, l'ultima corriera ___ da cinque minuti. (partire, trapassato)", "era partita", "partire takes essere: era partita (la corriera)."], ["Non avevo il biglietto perché ___ il portafoglio a casa. (lasciare, io, trapassato)", "avevo lasciato", "Trapassato: avevo + past participle."], ["Paolo era stanco perché ___ male. (dormire, trapassato)", "aveva dormito", "Paolo aveva dormito: it happened before he was tired."], ["Eravamo arrabbiati perché ___ la coincidenza. (perdere, noi, trapassato)", "avevamo perso|avevamo perduto", "noi avevamo perso: perdere takes avere."], ["Giulia non è venuta perché ___ il treno sbagliato. (prendere, trapassato)", "aveva preso", "prendere → preso: aveva preso."], ["Il treno è partito tardi perché il capotreno non ___ in tempo. (arrivare, trapassato)", "era arrivato", "arrivare takes essere: era arrivato."], ["Quando Anna è arrivata alla fermata, l'autobus ___.", ["è già passato", "era già passato", "passava già"], 1, "An action before another past action → trapassato."], ["Il capotreno mi ha fatto la multa perché ___ il biglietto.", ["non avevo convalidato", "non ero convalidato", "non convaliderò"], 0, "convalidare takes avere: non avevo convalidato."]], "act": {"type": "tr", "items": [["When I arrived at the station, the train had already left.", "Quando sono arrivato in stazione, il treno era già partito. (Quando sono arrivata…)"], ["I missed the connection because the first train had arrived late.", "Ho perso la coincidenza perché il primo treno era arrivato in ritardo."], ["Marco hadn't validated his ticket.", "Marco non aveva convalidato il biglietto."], ["We had never taken a night train before.", "Non avevamo mai preso un treno notturno prima."]]}, "mission": ["In stazione o alla fermata, leggi il tabellone: c'è un treno o un autobus in ritardo o soppresso? Scrivi un messaggio a un amico con il trapassato: «Quando sono arrivato, il treno era già partito!»", "At the station or bus stop, read the board: is a train or bus late or cancelled? Text a friend using the trapassato: 'When I arrived, the train had already left!'"]}, {"n": 62, "review": false, "topic": "Futuro anteriore", "short": "Futuro anteriore", "theme": "scadenze e appuntamenti", "type": "write", "cards": [["la scadenza", "the deadline"], ["entro venerdì", "by Friday"], ["rimandare", "to put off, to postpone"], ["disdire un appuntamento", "to cancel an appointment"], ["consegnare", "to hand in, to deliver"], ["in anticipo", "early, in advance"], ["il promemoria", "the reminder"], ["spostare l'appuntamento", "to move the appointment"]], "hint": ["Quando avrò finito, ti chiamerò.", "Appena sarò arrivato/a, ti scriverò. · Dopo che avremo mangiato, usciremo."], "ex": [["Quando ___ il lavoro, ti chiamerò. (finire, io, futuro anteriore)", "avrò finito", "Futuro anteriore: avrò + past participle."], ["Appena Sara ___ a casa, mi scriverà. (arrivare, futuro anteriore)", "sarà arrivata", "arrivare takes essere: sarà arrivata."], ["Dopo che ___ il progetto, andremo in vacanza. (consegnare, noi, futuro anteriore)", "avremo consegnato", "noi avremo consegnato: first we hand it in, then we go."], ["Quando ___ dal viaggio, vi racconteremo tutto. (tornare, noi, futuro anteriore)", "saremo tornati|saremo tornate", "tornare takes essere: saremo tornati or saremo tornate."], ["Ti presto il libro appena l'___ letto.", ["avrò", "sarò", "avevo"], 0, "leggere takes avere: appena l'avrò letto."], ["Luca non è ancora arrivato: ___ il treno. (perdere, futuro anteriore)", "avrà perso|avrà perduto", "Guess about the past: avrà
