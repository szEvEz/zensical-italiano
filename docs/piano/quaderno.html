<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quaderno d'italiano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style>
/* Layout: a squared-paper school notebook (quaderno a quadretti); one column of blocks, corrections in red and blue pen like an Italian teacher. */
:root{
  --paper:#f7f9fd; --grid:rgba(52,98,178,.09); --card:#ffffff; --ink:#18233d; --muted:#5a6681; --line:#dce3ef;
  --blue:#1d4ed8; --blue-soft:#e6edff; --red:#c62828; --red-soft:#fde8e8; --green:#16794c; --green-soft:#e3f4ec;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Caveat", "Bradley Hand", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e1422; --grid:rgba(130,160,225,.07); --card:#151d2f; --ink:#e4eaf6; --muted:#97a3bb; --line:#26314a;
  --blue:#86a8ff; --blue-soft:#1b2747; --red:#ff7a72; --red-soft:#3a1d22; --green:#5ccf97; --green-soft:#132e25; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e1422; --grid:rgba(130,160,225,.07); --card:#151d2f; --ink:#e4eaf6; --muted:#97a3bb; --line:#26314a;
  --blue:#86a8ff; --blue-soft:#1b2747; --red:#ff7a72; --red-soft:#3a1d22; --green:#5ccf97; --green-soft:#132e25; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.home-link{font-size:.85rem;text-decoration:none}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--blue)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.hand{font-family:var(--hand);font-size:1.35em;line-height:1}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
header.top{padding-block:20px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
.brand h1{font-size:1.7rem;font-weight:700}
.brand h1 span{color:var(--red);font-family:var(--hand);font-size:1.15em;font-weight:600;margin-left:4px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--red)}
.pill{display:inline-block;min-width:1.4em;padding:0 6px;border-radius:99px;background:var(--red-soft);color:var(--red);font-size:.75rem;font-weight:600;text-align:center;margin-left:4px}
.sync{font-size:.75rem;color:var(--muted)}

main{padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}

/* generic */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:.9rem}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.82rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--blue)}
.note{background:var(--blue-soft);border-radius:8px;padding:10px 14px;font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}

/* plan */
.intro{display:grid;gap:14px}
.intro p{margin:0;max-width:65ch}
.daytype{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0;padding:0;list-style:none}
.daytype li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:.85rem}
.daytype b{display:block;font-size:.9rem}
.week h2{font-size:1.15rem;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;color:var(--ink);min-height:118px}
.tile:hover{border-color:var(--blue)}
.tile .d{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.tile .t{font-family:var(--display);font-weight:500;font-size:1rem;line-height:1.2;flex:1}
.tile.today{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.tile .tag{font-size:.7rem;font-weight:600;color:var(--red);text-transform:uppercase;letter-spacing:.06em}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.tile.full .t::after{content:" ✓";color:var(--green)}

/* day */
.dayhead{display:grid;gap:8px}
.dayhead h1{font-size:2rem}
.daynav{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.daynav a{text-decoration:none}
.block{background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.block.isdone{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.bhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.bnum{font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;width:1.4em}
.btitle{flex:1;min-width:0}
.btitle h2{font-size:1.1rem}
.btitle p{margin:0;font-size:.82rem;color:var(--muted)}
.mins{font-size:.8rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.star{color:var(--red)}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;flex:none;color:transparent;font-weight:700}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--card)}
.bbody{padding:16px 18px 18px;display:grid;gap:14px;min-width:0}
.theory{margin:0;padding-left:1.1em;display:grid;gap:8px;max-width:68ch}

/* exercises */
ol.items{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:it}
ol.items>li{counter-increment:it;display:grid;grid-template-columns:2em 1fr;gap:4px 8px;padding:10px 12px;border-radius:8px;background:var(--paper);border:1px solid transparent}
ol.items>li::before{content:counter(it);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
ol.items>li.ok{background:var(--green-soft)}
ol.items>li.wrong{background:var(--red-soft)}
ol.items>li.near{background:var(--blue-soft)}
.q{min-width:0;line-height:2}
.q input.fill{border:none;border-bottom:2px solid var(--muted);background:transparent;padding:0 4px;margin:0 2px;min-width:5ch;max-width:100%;outline:none}
.q input.fill:focus{border-color:var(--blue)}
li.ok input.fill{border-color:var(--green);color:var(--green);font-weight:600}
li.wrong input.fill{border-color:var(--red);color:var(--red);text-decoration:line-through}
li.near input.fill{border-color:var(--blue);color:var(--blue)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px;cursor:pointer}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:600}
.opt.chosen-wrong{border-color:var(--red);color:var(--red);text-decoration:line-through}
.fb-line{grid-column:2;font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.pen-red{color:var(--red)} .pen-blue{color:var(--blue)} .pen-green{color:var(--green)}
.score{font-weight:600;font-variant-numeric:tabular-nums}

/* translation, dictation, writing */
.tr-item,.dict-item{display:grid;gap:6px;padding:12px;border-radius:8px;background:var(--paper)}
.en{font-weight:500}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 10px;resize:vertical;line-height:1.5}
textarea.write{min-height:220px;background-image:linear-gradient(transparent calc(1.5em + 7px),var(--grid) 0);background-size:100% 1.5em}
input.line{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 10px}
.model{font-size:.92rem;color:var(--green)}
.diff span{padding:0 1px}
.diff .miss{color:var(--red);text-decoration:underline wavy}
.diff .acc{color:var(--blue);text-decoration:underline}
.fb{border-left:3px solid var(--red);padding:4px 0 4px 14px;display:grid;gap:10px}
.fb p{margin:0}
.fb .corrected{background:var(--paper);border-radius:8px;padding:10px 12px;white-space:pre-wrap}
.errs{margin:0;padding-left:1.2em;display:grid;gap:6px}
.errs li.grave::marker{color:var(--red)}
.errs li.lieve::marker{color:var(--blue)}
.errs s{color:var(--muted)}
.errs .grave b{color:var(--red)} .errs .lieve b{color:var(--blue)}
.legend{font-size:.8rem;color:var(--muted)}
.ai-only{display:none} body[data-ai="yes"] .ai-only{display:revert}
.no-ai{display:none} body[data-ai="no"] .no-ai{display:revert}
body[data-audio="no"] .audio-only{display:none}
.no-audio{display:none} body[data-audio="no"] .no-audio{display:block}

/* speaking */
.qs{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.qs li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--paper);border-radius:8px}
.qs li span{min-width:0}
.timer{font-variant-numeric:tabular-nums;min-width:4.5em;justify-content:center}
.timer.run{border-color:var(--red);color:var(--red)}
.mission{font-size:1.05rem;max-width:65ch;margin:0}

/* flashcards */
.fc{display:grid;gap:12px;justify-items:center;padding:6px 0}
.card{width:100%;max-width:440px;min-height:170px;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center;padding:20px;text-align:center;gap:8px}
.card .front{font-size:1.25rem;font-weight:500}
.card .back{font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--blue)}
.fc .meta{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.deck{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.deck h3{font-size:1rem}

/* errori */
.notes{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.notes li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 12px;background:var(--paper);border-radius:8px}
.notes li div{min-width:0}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}

@media (max-width:560px){
  .dayhead h1{font-size:1.6rem}
  .bhead{padding:12px 14px} .bbody{padding:14px}
  ol.items>li{grid-template-columns:1.6em 1fr}
}
@media (prefers-reduced-motion:no-preference){ .card{transition:border-color .2s} }
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <a class="home-link" href="../">← Il mio italiano</a>
  <div class="brand">
    <h1>Quaderno d'italiano<span>14 giorni</span></h1>
    <div class="stats" id="stats"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="app"></main>

<script>
const WIKI = "https://szevez.github.io/zensical-italiano/";

/* Flashcard decks: "italiano|english" */
const DECKS = {

    "generoso|generous","altruista|selfless","divertente|funny","timido|shy","silenzioso|quiet","introverso|introverted","studioso|studious","irascibile|short-tempered","socievole|sociable","estroverso|outgoing","amichevole|friendly","pigro|lazy","puntuale|punctual","preciso|precise, careful","creativo|creative","gentile|kind, polite","simpatico|likeable, nice"]},
  persB: { name: "Personalità (2)", src: "lessico/personalita/", cards: [
    "sincero|honest","coraggioso|brave","scherzoso|playful, jokey","ordinato|tidy","egoista|selfish","sveglio|sharp, bright","sportivo|sporty","allegro|cheerful","maleducato|rude","paziente|patient","insicuro|insecure","debole|weak","loquace|talkative","sensibile|sensitive","permaloso|touchy, easily offended","deciso|determined, decisive","intelligente|intelligent"]},
  vestiti: { name: "Vestiti e meteo", src: "lessico/vestiti/", cards: [
    "la felpa|sweatshirt","il maglione|jumper","l'impermeabile|raincoat","l'ombrello|umbrella","le scarpe da ginnastica|trainers","i pantaloncini|shorts","il costume da bagno|swimsuit","le ciabatte|flip-flops","gli occhiali da sole|sunglasses","la camicia|shirt","la sciarpa|scarf","il cappotto|coat","il berretto|woolly hat","i guanti|gloves","gli stivali|boots","la tuta|tracksuit","Che tempo fa?|What's the weather like?","Fa freddo.|It's cold.","Piove.|It's raining.","È nuvoloso.|It's cloudy.","C'è il sole.|It's sunny."]},
  bar: { name: "Al bar e al ristorante", src: "dialoghi/al-ristorante/", cards: [
    "Posso avere il conto?|Can I have the bill?","Cosa mi consiglia?|What do you recommend? (formal)","un'acqua frizzante|a sparkling water","Va forte.|It's very popular.","Sono da solo.|I'm on my own.","accomodarsi|to take a seat","Ecco a te.|Here you go. (informal)","il coperto|cover charge","lo scontrino|receipt","al banco|at the counter (standing)","un caffè macchiato|espresso with a dash of milk","il contorno|side dish","il primo / il secondo|first course / main course","Per me…|I'll have… (ordering)","Si può pagare con la carta?|Can I pay by card?","Siamo in quattro.|There are four of us.","da asporto|to take away"]},
  connettivi: { name: "Connettivi", src: null, cards: [
    "quindi|so, therefore","però|but, however","invece|instead, on the other hand","comunque|anyway, however","infatti|indeed, in fact","inoltre|furthermore","tuttavia|nevertheless","mentre|while","nonostante|despite","anzi|on the contrary, or rather","cioè|that is, I mean","insomma|in short, all in all","siccome|since, as (reason)","perciò|that's why","eppure|and yet","affinché|so that","purché|provided that","a meno che|unless"]},
  casa: { name: "Casa e agenzia", src: "dialoghi/agenzia-immobiliare/", cards: [
    "i metri quadrati|square metres","ristrutturato|renovated","gli infissi|window frames","gli impianti|building systems (wiring, plumbing…)","la cucina abitabile|eat-in kitchen","ben servito|well connected (shops, transport)","fare un'offerta|to make an offer","fissare una visita|to arrange a viewing","l'affitto|rent","il proprietario|owner, landlord","le spese condominiali|building service charges","la caparra|deposit","il trasloco|house move","il soggiorno|living room","il cortile|courtyard","ammobiliato|furnished"]},
  viaggi: { name: "Viaggi e prenotazioni", src: "dialoghi/prenotazioni/", cards: [
    "il binario|platform","obliterare il biglietto|to validate the ticket","andata e ritorno|return (ticket)","solo andata|one-way","in ritardo|late, delayed","la coincidenza|connection (train)","la carta d'imbarco|boarding pass","allacciare la cintura|to fasten the seatbelt","la cappelliera|overhead locker","il bagaglio a mano|hand luggage","atterrare|to land","decollare|to take off","disdire|to cancel (a booking)","lo sciopero|strike","la fermata|stop (bus, tram)","la biglietteria|ticket office"]},
  colloquiali: { name: "Espressioni colloquiali", src: null, cards: [
    "In bocca al lupo! — Crepi!|Good luck! — Thanks!","Non vedo l'ora.|I can't wait.","fare due chiacchiere|to have a chat","avere voglia di|to feel like (doing)","Meno male!|Thank goodness!","Magari!|I wish! / If only!","Figurati!|Don't mention it!","Ci mancherebbe!|Of course! / Not at all!","Ma dai!|No way! / Really?","Che peccato!|What a shame!","Non fa niente.|Never mind.","Mi raccomando!|Make sure you do! / Don't forget!","fare finta di|to pretend to","dare fastidio|to bother","Che ne dici?|What do you think? / How about it?","Boh.|Dunno.","prendere in giro|to tease, make fun of"]},
  avanzate: { name: "Parole avanzate", src: "lessico/parole-avanzate/", cards: [

  verbiprep: { name: "Verbi + preposizione", src: null, cards: [
    "pensare a|to think about","riuscire a|to manage to","smettere di|to stop (doing)","cercare di|to try to","decidere di|to decide to","provare a|to try (doing)","abituarsi a|to get used to","innamorarsi di|to fall in love with","fidarsi di|to trust","lamentarsi di|to complain about","occuparsi di|to take care of","accorgersi di|to notice","dipendere da|to depend on","avere bisogno di|to need","avere paura di|to be afraid of","sognare di|to dream of","cominciare a|to begin to","finire di|to finish (doing)"]},

};

/* Exercises: fill = [question, "answer|alt", explanation?]  ·  choice = [question, [options], correctIndex, explanation?] */
const DAYS = [
{ n:1, topic:"Passato prossimo", short:"Passato prossimo", deck:"emozioni",
  wiki:[["Passato prossimo","grammatica/passato-prossimo/"],["Verbo essere","grammatica/essere/"],["Verbo avere","grammatica/avere/"]],
  theory:[
    "<b>avere / essere + participio</b>: ho mangiato, sono andato.",
    "<b>Essere</b> con i verbi di movimento e cambiamento (andare, venire, partire, nascere, diventare), con <i>stare, rimanere, piacere, costare</i> e con tutti i riflessivi (mi sono svegliato). Il participio concorda: <i>Maria è uscita</i>.",
    "Participi irregolari da sapere a memoria: fatto, detto, preso, messo, visto, scritto, letto, aperto, chiuso, rimasto, venuto, nato, stato, vissuto, scelto, perso, chiesto, risposto, bevuto.",
    "Con <b>lo / la / li / le</b> + avere il participio concorda: <i>Le chiavi? Le ho messe qui.</i>",
    "Alcuni verbi cambiano ausiliare: <i>Ho finito il lavoro</i> (transitivo) / <i>Il film è finito</i> (intransitivo). Stesso con cominciare, passare."],
  ex:[
    ["Ieri sera io e Marco ___ (uscire) tardi.","siamo usciti"],
    ["Maria ___ (nascere) a Napoli nel 1990.","è nata"],
    ["Non ho ancora ___ (leggere) quel libro.","letto"],
    ["Stamattina mi ___ (svegliarsi) alle sei.","sono svegliato|sono svegliata","Reflexive verbs always take essere."],
    ["Quanto ___ (costare) la cena?","è costata","costare takes essere; la cena is feminine."],
    ["Le chiavi? Le ___ (mettere) sul tavolo.","ho messe","With avere + le, the participle agrees: messe."],
    ["Il film ___ alle dieci.",["ha finito","è finito","è finita"],1,"finire without an object takes essere; il film is masculine."],
    ["Io ___ tutto il lavoro.",["ho finito","sono finito"],0,"With a direct object (il lavoro), finire takes avere."],

async function connect(){
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    dbRef = db.doc("data/users/" + id + "/quaderno");
    const snap = await dbRef.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && (remote.updated || 0) > (S.updated || 0)) {
      S = Object.assign(fresh(), JSON.parse(JSON.stringify(remote)));
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {}
      render();
    } else if ((S.updated || 0) > (remote?.updated || 0)) push();
    setSync("synced");
  } catch { setSync("error"); }
}

/* ---------- capabilities: Claude for corrections, a voice for listening ---------- */
let samplerP = null, ttsP = null;
function getSampler(){ return samplerP ||= (async () => { try { return window.claude?.use ? await claude.use("sample") : null; } catch { return null; } })(); }
function getTTS(){
  return ttsP ||= (async () => {
    try { const t = window.claude?.use ? await claude.use("tts") : null;
      if (t) return { speak: (txt, rate) => t.speak(txt, { language:"it-IT", rate }).catch(() => {}) }; } catch {}
    if ("speechSynthesis" in window) return { speak: (txt, rate) => new Promise(res => {
      const u = new SpeechSynthesisUtterance(txt); u.lang = "it-IT"; u.rate = rate;
      const v = speechSynthesis.getVoices().find(v => (v.lang || "").toLowerCase().startsWith("it")); if (v) u.voice = v;
      u.onend = u.onerror = res; speechSynthesis.cancel(); speechSynthesis.speak(u); }) };
    return null;
  })();
}
getSampler().then(s => { document.body.dataset.ai = s ? "yes" : "no"; });
getTTS().then(t => { document.body.dataset.audio = t ? "yes" : "no"; });
async function say(text, rate = 1){ const t = await getTTS(); if (t) t.speak(text, rate); }
function aiError(e){
  const c = e && e.code;
  if (c === "not_granted") return "Hai scelto di non usare Claude da questa pagina. Puoi riattivarlo dal menu Permessi dell'artifact.";
  if (c === "rate_limited") return "Troppe richieste in poco tempo. Riprova tra un minuto.";
  if (c === "cancelled") return "Correzione annullata.";
  return "La correzione non è riuscita. Riprova tra poco.";
}

/* ---------- dates & progress ---------- */
const MS = 864e5;
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const dateOf = n => { const d = parseD(S.start); d.setDate(d.getDate() + n - 1); return d; };
const fmtD = d => d.toLocaleDateString("it-IT", { weekday:"short", day:"numeric", month:"short" });
const todayN = () => { const t = new Date(); t.setHours(0,0,0,0); return Math.round((t - parseD(S.start)) / MS) + 1; };
const STUDY = BLOCKS.filter(b => b.id !== "mission");
const CORE = BLOCKS.filter(b => b.core).map(b => b.id);
const dayPct = n => { const d = S.days[n]; return d ? STUDY.filter(b => d.done[b.id]).length / STUDY.length : 0; };
const dayFull = n => { const d = S.days[n]; return !!d && CORE.every(id => d.done[id]); };
const minutes = () => Object.values(S.days).reduce((a, d) => a + BLOCKS.reduce((m, b) => m + (d.done?.[b.id] ? b.min : 0), 0), 0);
const openErrs = () => Object.keys(S.errs).length + S.notes.length;

/* ---------- answer checking ---------- */
const norm = s => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s*'\s*/g, "'").replace(/\s+/g, " ").trim().replace(/[.!?,;:]+$/, "").trim();
const bare = s => norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function grade(given, ans){
  const g = norm(given); if (!g) return null;
  const alts = ans.split("|");
  if (alts.some(a => norm(a) === g)) return "ok";
  if (alts.some(a => bare(a) === bare(g))) return "near";
  return "wrong";
}
const words = s => String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:«»"()—–-]/g, " ").replace(/'/g, "' ").split(/\s+/).filter(Boolean);
const wcount = s => String(s).trim().split(/\s+/).filter(Boolean).length;

/* ---------- views ---------- */
let view = { k:"plan" };
function route(){
  const h = decodeURIComponent(location.hash.slice(1)); let m;
  if (h === "piano") view = { k:"plan" };
  else if ((m = h.match(/^giorno-(\d+)$/))) view = { k:"day", n: Math.min(14, Math.max(1, +m[1])) };
  else if (h === "vocaboli") view = { k:"vocab" };
  else if (h === "errori") view = { k:"err" };
  else { const t = todayN(); view = t >= 1 && t <= 14 ? { k:"day", n:t } : { k:"plan" }; }
  player = null; errSnap = null;
  render(); window.scrollTo(0, 0);
}
function render(){
  renderStats(); renderTabs();
  const app = $("#app");
  app.innerHTML = view.k === "day" ? dayView(view.n) : view.k === "vocab" ? vocabView() : view.k === "err" ? errView() : planView();
  if (player) drawPlayer();
}
function renderStats(){
  const t = todayN(); const done = DAYS.filter(d => dayFull(d.n)).length;
  const syncTxt = sync === "synced" ? "Sincronizzato con il tuo account" : sync === "error" ? "Salvato solo su questo dispositivo" : "Salvato su questo dispositivo";
  $("#stats").innerHTML =
    (t >= 1 && t <= 14 ? `<span>Oggi è il giorno <b>${t}</b> di 14</span>` : t < 1 ? `<span>Si comincia ${esc(fmtD(dateOf(1)))}</span>` : `<span>Piano finito</span>`) +
    `<span><b>${done}</b>/14 giorni completati</span><span><b>${minutes()}</b> minuti di studio</span><span class="sync">${syncTxt}</span>`;
}
function renderTabs(){
  const t = todayN(); const n = t >= 1 && t <= 14 ? t : (view.k === "day" ? view.n : 1);
  const cur = k => view.k === k ? ' aria-current="page"' : "";
  const e = openErrs();
  $("#tabs").innerHTML = `<a href="#piano"${cur("plan")}>Piano</a><a href="#giorno-${view.k === "day" ? view.n : n}"${cur("day")}>${view.k === "day" ? "Giorno " + view.n : "Oggi"}</a><a href="#vocaboli"${cur("vocab")}>Vocaboli</a><a href="#errori"${cur("err")}>Errori${e ? `<span class="pill">${e}</span>` : ""}</a>`;
}

/* ----- day ----- */

  const d = DAYS[n-1], st = D(n);
  const blocks = BLOCKS.map((b, i) => {
    const body = BODY[b.id](d, st);
    const done = !!st.done[b.id];
    return `<section class="block${done ? " isdone" : ""}" id="b-${b.id}">
      <div class="bhead"><span class="bnum">${b.id === "mission" ? "+" : i + 1}</span>
        <div class="btitle"><h2>${b.core ? '<span class="star" title="Fa parte della versione corta">★</span> ' : ""}${esc(b.title)}</h2><p>${esc(b.what)}</p></div>
        <span class="mins">${b.min ? b.min + " min" : "dal vivo"}</span>
        <button class="check" data-act="done" data-n="${n}" data-b="${b.id}" aria-pressed="${done}" aria-label="Segna ${esc(b.title)} come fatto">✓</button></div>
      <div class="bbody">${body}</div></section>`;
  }).join("");
  return `<nav class="daynav">${n > 1 ? `<a href="#giorno-${n-1}">← Giorno ${n-1}</a>` : "<span></span>"}${n < 14 ? `<a href="#giorno-${n+1}">Giorno ${n+1} →</a>` : "<span></span>"}</nav>
  <section class="dayhead">
    <span class="eyebrow">Giorno ${n} di 14 · ${esc(fmtD(dateOf(n)))}</span>
    <h1>${esc(d.topic)}</h1>
    <div class="chips"><span class="muted" style="font-size:.85rem">Sul tuo sito:</span>${d.wiki.map(([l,p]) => `<a class="chip" href="${WIKI + p}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join("")}</div>
  </section>${blocks}`;
}

/* ----- exercise items (shared by the day view and the Errori view) ----- */
function itemHTML(ctx, n, i, it, res){
  const isMC = Array.isArray(it[1]);
  const r = res?.r, cls = r ? ` class="${r}"` : "";
  const data = `data-ctx="${ctx}" data-n="${n}" data-i="${i}"`;
  let q, fb = "";
  if (isMC) {
    const [qq, opts, ok, x] = it;
    q = `${esc(qq).replace("___", "<b>___</b>")}<div class="opts">${opts.map((o, k) => {
      const c = r ? (k === ok ? " right" : (res.g === k ? " chosen-wrong" : "")) : "";
      return `<button class="opt${c}" data-act="mc" ${data} data-o="${k}"${r ? " disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>`;
    if (r === "ok") fb = `<span class="hand pen-green">giusto!</span>${x ? `<span class="muted">${esc(x)}</span>` : ""}`;
    if (r === "wrong") fb = `<span class="hand pen-red">no</span><span>→ <b>${esc(opts[ok])}</b></span>${x ? `<span class="muted">${esc(x)}</span>` : ""}`;
  } else {
    const [qq, ans, x] = it;
    const alts = ans.split("|"), size = Math.max(5, ...alts.map(a => a.length)) + 2;
    const input = `<input class="fill" id="in-${ctx}-${n}-${i}" ${data} size="${size}" value="${esc(res?.g || "")}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Risposta ${i+1}"${r ? " readonly" : ""}>`;
    const parts = esc(qq).split("___");
    q = parts.length > 1 ? parts[0] + input + parts.slice(1).join("___") : esc(qq) + " " + input;
    if (!r) q += ` <button class="btn small" data-act="check" ${data}>Controlla</button>`;
    if (r === "ok") fb = `<span class="hand pen-green">giusto!</span>${alts.length > 1 ? `<span class="muted">Anche: ${esc(alts.filter(a => norm(a) !== norm(res.g)).join(" / "))}</span>` : ""}`;
    if (r === "near") fb = `<span class="hand pen-blue">attento agli accenti</span><span>→ <b>${esc(alts[0])}</b></span>`;
    if (r === "wrong") fb = `<span class="hand pen-red">no</span><span>→ <b>${esc(alts.join(" / "))}</b></span>${x ? `<span class="muted">${esc(x)}</span>` : ""}`;
  }
  return `<li${cls} id="li-${ctx}-${n}-${i}"><div class="q">${q}</div>${fb ? `<div class="fb-line">${fb}</div>` : ""}</li>`;
}
function answer(ctx, n, i, given, r){
  const key = `d${n}_${i}`, it = DAYS[n-1].ex[i];
  if (ctx === "d") {
    const st = D(n); st.ex[i] = { r, g: given };
    if (r === "wrong") S.errs[key] = { t: Date.now(), c: (S.errs[key]?.c || 0) + 1 };
    if (Object.keys(st.ex).length === DAYS[n-1].ex.length) st.done.ex = true;
  } else {
    errSnap[key] = { r, g: given };
    if (r !== "wrong") { delete S.errs[key]; S.fixed = (S.fixed || 0) + 1; }
    else S.errs[key] = { t: Date.now(), c: (S.errs[key]?.c || 0) + 1 };
  }
  save();
  const li = $(`#li-${ctx}-${n}-${i}`);
  if (li) li.outerHTML = itemHTML(ctx, n, i, it, ctx === "d" ? D(n).ex[i] : errSnap[key]);
  if (ctx === "d") {
    const st = D(n), vals = Object.values(st.ex);
    const sc = $("#exscore"); if (sc) sc.textContent = `${vals.filter(v => v.r !== "wrong").length} su ${DAYS[n-1].ex.length} giuste`;
    if (st.done.ex) markDoneUI("ex", true);
    const next = $(`#in-d-${n}-${i+1}`); if (next && r) next.focus();
  }
  renderTabs();
}
function checkFill(el){
  const { ctx, n, i } = el.dataset; const it = DAYS[n-1].ex[i];
  const r = grade(el.value, it[1]); if (!r) { el.focus(); return; }
  answer(ctx, +n, +i, el.value.trim(), r);
}
function markDoneUI(b, on){
  const sec = $("#b-" + b); if (!sec) return;
  sec.classList.toggle("isdone", on); const c = sec.querySelector(".check"); if (c) c.setAttribute("aria-pressed", on);
}

/* ----- translation feedback ----- */
function trFeedback(fb){
  if (!fb) return "";
  if (fb.ok) return `<span class="hand pen-green">giusto!</span> ${fb.nota ? `<span class="muted" style="font-size:.88rem">${esc(fb.nota)}</span>` : ""}`;
  return `<div style="font-size:.92rem"><span class="hand pen-red">correzione</span> <b class="pen-red">${esc(fb.corretta)}</b>${fb.nota ? `<div class="muted">${esc(fb.nota)}</div>` : ""}</div>`;
}
async function aiTranslations(n){
  const d = DAYS[n-1], st = D(n), status = $("#trstatus"), btn = $('[data-act="ai-tr"]');
  const todo = d.tr.map(([en, it], i) => ({ n: i+1, en, modello: it, studente: (st.tr[i] || "").trim() })).filter(x => x.studente);
  if (!todo.length) { status.textContent = "Scrivi almeno una traduzione."; return; }
  const sample = await getSampler(); if (!sample) return;
  btn.disabled = true; status.textContent = "Claude sta correggendo…";
  const prompt = `Sei un insegnante di italiano madrelingua. Correggi le traduzioni dall'inglese all'italiano di uno studente di livello B1 che vive in Italia.
Per ogni frase hai l'originale inglese, una soluzione modello (non l'unica possibile) e la risposta dello studente. Accetta qualsiasi traduzione corretta e naturale, anche se diversa dal modello. Ignora maiuscole e punteggiatura finale.
Rispondi SOLO con JSON valido in questo formato:
{"risultati":[{"n":1,"ok":true,"corretta":"la frase dello studente corretta, cambiando il meno possibile","nota":"one short sentence in English explaining the main mistake; empty string if perfect"}]}

${JSON.stringify(todo)}`;
  try {
    const out = await sample.json(prompt, { modelTier: "quick" });
    for (const r of (out?.risultati || [])) {
      const i = r.n - 1; if (!d.tr[i]) continue;
      st.trc[i] = { ok: !!r.ok, corretta: String(r.corretta || ""), nota: String(r.nota || "") };
      if (!r.ok && r.corretta) addNote(n, st.tr[i], r.corretta, r.nota, "traduzione");
      const box = $(`#trfb-${n}-${i}`); if (box) box.innerHTML = trFeedback(st.trc[i]);
    }
    st.done.tr = true; markDoneUI("tr", true); save(); status.textContent = "";
  } catch (e) { status.textContent = aiError(e); }
  btn.disabled = false;
}

/* ----- dictation ----- */
function dictDiff(target, given){
  const tw = words(target), gw = words(given).map(w => bare(w)), gExact = words(given);
  const m = tw.length, k = gw.length, L = Array.from({ length: m+1 }, () => new Array(k+1).fill(0));
  for (let a = m-1; a >= 0; a--) for (let b = k-1; b >= 0; b--) L[a][b] = bare(tw[a]) === gw[b] ? L[a+1][b+1] + 1 : Math.max(L[a+1][b], L[a][b+1]);
  const marks = []; let a = 0, b = 0;
  while (a < m) {
    if (b < k && bare(tw[a]) === gw[b]) { marks.push(tw[a] === gExact[b].replace(/'$/, "'") || norm(tw[a]) === norm(gExact[b]) ? ["", tw[a]] : ["acc", tw[a]]); a++; b++; }
    else if (b < k && L[a][b+1] >= L[a+1][b]) b++;
    else { marks.push(["miss", tw[a]]); a++; }
  }
  const ok = marks.filter(x => x[0] === "").length;
  const html = marks.map(([c, w]) => `<span${c ? ` class="${c}"` : ""}>${esc(w.replace(/' $/, "'"))}</span>`).join(" ").replace(/' /g, "'");
  const all = ok === tw.length && k === tw.length;
  return `<div class="diff">${all ? '<span class="hand pen-green">perfetto!</span> ' : `<span class="score">${ok}/${tw.length}</span> `}${html}</div>`;
}
function checkDict(n, i){
  const el = $(`#dict-${n}-${i}`); if (!el || !el.value.trim()) return;
  const st = D(n); st.dict[i] = { g: el.value.trim() };
  $(`#dictfb-${n}-${i}`).innerHTML = dictDiff(DAYS[n-1].dict[i], el.value);
  if (Object.keys(st.dict).length === DAYS[n-1].dict.length) { st.done.dict = true; markDoneUI("dict", true); }
  save();
}

/* ----- writing ----- */
function writeFeedback(fb){
  if (!fb) return "";
  const errs = (fb.errori || []);
  return `<div class="fb">
    <div class="row"><span class="hand pen-red">Correzione</span>${fb.livello ? `<span class="muted" style="font-size:.85rem">Livello stimato del testo: <b>${esc(fb.livello)}</b></span>` : ""}</div>
    <p class="corrected">${esc(fb.corretto)}</p>
    ${errs.length ? `<ol class="errs">${errs.map(e => `<li class="${e.tipo === "grave" ? "grave" : "lieve"}"><s>${esc(e.sbagliato)}</s> → <b>${esc(e.giusto)}</b> <span class="muted">${esc(e.spiegazione)}</span></li>`).join("")}</ol>
      <p class="legend">Come a scuola: <span class="pen-red">rosso</span> = errore grave, <span class="pen-blue">blu</span> = errore lieve. Gli errori sono salvati nella scheda Errori.</p>` : `<p><span class="hand pen-green">Nessun errore, bravo!</span></p>`}
    ${fb.bene ? `<p><b>Cosa funziona:</b> ${esc(fb.bene)}</p>` : ""}
    ${fb.consiglio ? `<p><b>Per la prossima volta:</b> ${esc(fb.consiglio)}</p>` : ""}
  </div>`;
}
let writeCtl = null;
async function aiWrite(n){
  const d = DAYS[n-1], st = D(n), box = $(`#wfb-${n}`), btn = $('[data-act="ai-write"]');
  const text = (st.write || "").trim();
  if (wcount(text) < 15) { box.innerHTML = `<p class="note" style="margin:0">Scrivi almeno qualche frase (${esc(d.write.words)} parole) prima di chiedere la correzione.</p>`; return; }
  const sample = await getSampler(); if (!sample) return;
  if (writeCtl) writeCtl.abort(); writeCtl = new AbortController();
  btn.disabled = true; box.innerHTML = `<p class="muted" style="margin:0">Claude sta leggendo il tuo testo… (può volerci mezzo minuto)</p>`;
  const prompt = `Sei un insegnante di italiano madrelingua, gentile ma preciso. Lo studente ha livello B1 e vive in Italia.
Compito: "${d.write.task}"
Obiettivo grammaticale: ${d.write.target}.
Testo dello studente:
"""
${text}
"""
Correggi il testo cambiando il meno possibile, così che resti suo ma diventi corretto e naturale.
Rispondi SOLO con JSON valido in questo formato:
{"corretto":"il testo completo corretto","errori":[{"sbagliato":"parole originali","giusto":"parole corrette","tipo":"grave","spiegazione":"one short sentence in English"}],"livello":"A2, B1, B1+ o B2","bene":"una frase in italiano semplice su cosa funziona","consiglio":"un consiglio concreto in italiano semplice per il prossimo testo"}
"grave" = errore di grammatica o di significato; "lieve" = accento, ortografia o parola poco naturale. Al massimo 12 errori, i più importanti per primi.`;
  try {
    const out = await sample.json(prompt, { signal: writeCtl.signal });
    st.wfb = { corretto: String(out?.corretto || ""), errori: Array.isArray(out?.errori) ? out.errori.slice(0, 12).map(e => ({ sbagliato: String(e.sbagliato || ""), giusto: String(e.giusto || ""), tipo: e.tipo === "grave" ? "grave" : "lieve", spiegazione: String(e.spiegazione || "") })) : [], livello: String(out?.livello || ""), bene: String(out?.bene || ""), consiglio: String(out?.consiglio || "") };
    st.wfb.errori.forEach(e => addNote(n, e.sbagliato, e.giusto, e.spiegazione, "scrittura"));
    st.done.write = true; markDoneUI("write", true); save();
    box.innerHTML = writeFeedback(st.wfb);
  } catch (e) { box.innerHTML = `<p class="note" style="margin:0">${esc(aiError(e))}</p>`; }
  btn.disabled = false;
}
function addNote(n, wrong, right, why, kind){
  if (!wrong || !right || norm(wrong) === norm(right)) return;
  if (S.notes.some(x => norm(x.w) === norm(wrong) && norm(x.r) === norm(right))) return;
  S.notes.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), n, w: String(wrong), r: String(right), x: String(why || ""), k: kind });
  S.notes = S.notes.slice(0, 150);
}

/* ----- flashcards ----- */
const cardsOf = key => DECKS[key].cards.map((c, i) => { const [it, en] = c.split("|"); return { id: `${key}_${i}`, it, en, deck: key }; });
const decksBefore = n => DAYS.filter(x => x.n < n && x.deck[0] !== "@").map(x => x.deck);
const dueCards = n => decksBefore(n).flatMap(cardsOf).filter(c => S.cards[c.id] != null && S.cards[c.id] <= 2).sort((a, b) => S.cards[a.id] - S.cards[b.id]).slice(0, 12);
function reviewPool(n){
  const all = decksBefore(n).flatMap(cardsOf);
  let p = all.filter(c => (S.cards[c.id] ?? 0) <= 2);
  if (p.length < 15) p = all.slice().sort((a, b) => (S.cards[a.id] ?? 0) - (S.cards[b.id] ?? 0)).slice(0, 30);
  return p.slice(0, 40);
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let player = null;
function startPlayer(mode, arg){
  let q, label, n = null;
  if (mode === "day") { n = +arg; const d = DAYS[n-1]; q = d.deck === "@review" ? reviewPool(n) : [...cardsOf(d.deck), ...dueCards(n)]; label = d.deck === "@review" ? "Ripasso" : DECKS[d.deck].name; }
  else if (mode === "deck") { q = cardsOf(arg); label = DECKS[arg].name; }
  else { q = Object.keys(DECKS).flatMap(cardsOf).filter(c => S.cards[c.id] === 1); label = "Carte difficili"; }
  if (!q.length) { player = { done: true, empty: true, label }; drawPlayer(); return; }
  player = { mode, n, label, q: shuffle(q), i: 0, show: false, yes: 0, no: 0, again: new Set(), dir: player?.dir || "en" };
  drawPlayer();
}
function drawPlayer(){
  const box = $("#player"); if (!box || !player) return;
  const p = player;
  if (p.empty) { box.innerHTML = `<p class="empty">Nessuna carta in questo gruppo, per ora.</p>`; return; }
  if (p.done) {
    box.innerHTML = `<div class="fc"><p class="hand pen-green" style="font-size:2rem;margin:0">Finito!</p><p class="meta">${p.yes} sapute · ${p.no} da ripassare</p>
      <div class="row"><button class="btn" data-act="fc-close">Chiudi</button></div></div>`;
    return;
  }
  const c = p.q[p.i], front = p.dir === "en" ? c.en : c.it, back = p.dir === "en" ? c.it : c.en;
  box.innerHTML = `<div class="fc">
    <div class="row"><span class="meta">${esc(p.label)} · ${p.i + 1}/${p.q.length}</span><button class="btn small" data-act="fc-dir">${p.dir === "en" ? "Inglese → italiano" : "Italiano → inglese"}</button></div>
    <div class="card"><div class="front">${esc(front)}</div>${p.show ? `<div class="back">${esc(back)}</div>` : ""}</div>
    ${p.show ? `<div class="row"><button class="btn small audio-only" data-act="say-card">▶ Pronuncia</button></div>
      <div class="row"><button class="btn" data-act="fc-no" style="color:var(--red)">Non ancora</button><button class="btn primary" data-act="fc-yes">Lo so</button></div>`
      : `<button class="btn primary" data-act="fc-flip">Mostra la risposta</button><p class="meta" style="margin:0">Prima dilla ad alta voce, poi gira la carta.</p>`}
  </div>`;
}
function fcAnswer(yes){
  const p = player, c = p.q[p.i];
  if (yes) { S.cards[c.id] = Math.min(5, (S.cards[c.id] ?? 1) + 1); p.yes++; }
  else { S.cards[c.id] = 1; p.no++; if (!p.again.has(c.id)) { p.again.add(c.id); p.q.push(c); } }
  p.i++; p.show = false;
  if (p.i >= p.q.length) { p.done = true; if (p.mode === "day") { D(p.n).done.vocab = true; markDoneUI("vocab", true); } }
  save(); drawPlayer();
}

/* ----- vocab view ----- */
function vocabView(){
  const hard = Object.values(S.cards).filter(b => b === 1).length;
  return `<section class="panel" style="display:grid;gap:12px"><span class="eyebrow">Vocaboli</span><h2>Tutti i mazzi</h2>
    <p style="margin:0" class="muted">Una carta è “sicura” quando l'hai saputa almeno due volte di fila. Le carte che non sapevi tornano nei giorni successivi.</p>
    <div class="row"><button class="btn primary" data-act="fc-start" data-mode="hard"${hard ? "" : " disabled"}>Ripassa le carte difficili (${hard})</button></div>
    <div id="player"></div></section>
    <div class="decks">${Object.entries(DECKS).map(([k, d]) => {
      const cs = cardsOf(k), sure = cs.filter(c => (S.cards[c.id] ?? 0) >= 3).length, seen = cs.filter(c => S.cards[c.id] != null).length;
      const day = DAYS.find(x => x.deck === k);
      return `<div class="deck"><span class="eyebrow">${day ? "Giorno " + day.n : ""}</span><h3>${esc(d.name)}</h3>
        <span class="bar"><i style="width:${sure / cs.length * 100}%"></i></span>
        <span class="muted" style="font-size:.82rem">${sure} sicure · ${seen} viste · ${cs.length} in tutto</span>
        <div class="row"><button class="btn small" data-act="fc-start" data-mode="deck" data-k="${k}">Studia</button>${d.src ? `<a class="chip" href="${WIKI + d.src}" target="_blank" rel="noopener">Sul sito ↗</a>` : ""}</div></div>`;
    }).join("")}</div>`;
}

/* ----- errors view ----- */
let errSnap = null;
function errView(){
  if (!errSnap) errSnap = Object.fromEntries(Object.keys(S.errs).map(k => [k, null]));
  const keys = Object.keys(errSnap).sort((a, b) => { const [, an, ai] = a.match(/d(\d+)_(\d+)/), [, bn, bi] = b.match(/d(\d+)_(\d+)/); return an - bn || ai - bi; });
  const items = keys.map(k => { const [, n, i] = k.match(/d(\d+)_(\d+)/); return itemHTML("e", +n, +i, DAYS[n-1].ex[i], errSnap[k]).replace("<li", `<li title="Giorno ${n}"`); }).join("");
  return `<section class="panel" style="display:grid;gap:12px"><span class="eyebrow">Errori</span><h2>Il tuo quaderno degli errori</h2>
    <p style="margin:0" class="muted">Qui finisce tutto quello che hai sbagliato. Un esercizio sparisce quando lo rifai giusto. Esercizi corretti finora: <b>${S.fixed || 0}</b>.</p></section>
  <section class="block"><div class="bhead"><div class="btitle"><h2>Esercizi da rifare</h2><p>${Object.keys(S.errs).length} aperti</p></div></div>
    <div class="bbody">${keys.length ? `<ol class="items">${items}</ol>` : `<p class="empty">Nessun esercizio sbagliato. Bene così!</p>`}</div></section>
  <section class="block"><div class="bhead"><div class="btitle"><h2>Dai tuoi testi e dalle traduzioni</h2><p>Errori trovati da Claude. Rileggili ad alta voce nella forma corretta.</p></div></div>
    <div class="bbody">${S.notes.length ? `<ul class="notes">${S.notes.map(x => `<li><div><s class="muted">${esc(x.w)}</s> → <b class="pen-red">${esc(x.r)}</b>${x.x ? `<div class="muted" style="font-size:.85rem">${esc(x.x)}</div>` : ""}<div class="muted" style="font-size:.75rem">Giorno ${x.n} · ${esc(x.k)}</div></div><button class="btn small" data-act="note-del" data-id="${esc(x.id)}">Imparato</button></li>`).join("")}</ul>` : `<p class="empty">Ancora niente. Gli errori dei testi corretti da Claude appariranno qui.</p>`}</div></section>`;
}

/* ---------- events ---------- */
let timers = {};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, n = +el.dataset.n, i = +el.dataset.i;
  if (a === "done") { const st = D(n), b = el.dataset.b; st.done[b] = !st.done[b]; markDoneUI(b, st.done[b]); save(); }
  else if (a === "check") checkFill($(`#in-${el.dataset.ctx}-${n}-${i}`));
  else if (a === "mc") { const it = DAYS[n-1].ex[i], o = +el.dataset.o; answer(el.dataset.ctx, n, i, o, o === it[2] ? "ok" : "wrong"); }
  else if (a === "reset-ex") { D(n).ex = {}; D(n).done.ex = false; save(); render(); }
  else if (a === "ai-tr") aiTranslations(n);
  else if (a === "ai-write") aiWrite(n);
  else if (a === "say") say(DAYS[n-1].dict[i], +el.dataset.rate);
  else if (a === "say-card") { const c = player?.q[player.i]; if (c) say(c.it.split(" — ")[0], 0.9); }
  else if (a === "dict-check") checkDict(n, i);
  else if (a === "fc-start") startPlayer(el.dataset.mode, el.dataset.mode === "deck" ? el.dataset.k : n);
  else if (a === "fc-flip") { player.show = true; drawPlayer(); }
  else if (a === "fc-yes") fcAnswer(true);
  else if (a === "fc-no") fcAnswer(false);
  else if (a === "fc-dir") { player.dir = player.dir === "en" ? "it" : "en"; player.show = false; drawPlayer(); }
  else if (a === "fc-close") { player = null; $("#player").innerHTML = ""; if (view.k === "vocab") render(); }
  else if (a === "note-del") { S.notes = S.notes.filter(x => x.id !== el.dataset.id); save(); render(); }
  else if (a === "timer") {
    const id = el.id;
    if (timers[id]) { clearInterval(timers[id]); delete timers[id]; el.classList.remove("run"); el.textContent = "1:00"; return; }
    let s = 60; el.classList.add("run"); el.textContent = "1:00";
    timers[id] = setInterval(() => { s--; el.textContent = s > 0 ? `0:${String(s).padStart(2, "0")}` : "Fatto!"; if (s <= 0) { clearInterval(timers[id]); delete timers[id]; el.classList.remove("run"); } }, 1000);
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const t = e.target;
  if (t.matches("input.fill") && !t.readOnly) { e.preventDefault(); checkFill(t); }
  else if (t.dataset.dict) { e.preventDefault(); const [n, i] = t.dataset.dict.split(":"); checkDict(+n, +i); }
});
let typeTimer = null;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.tr) { const [n, i] = t.dataset.tr.split(":"); D(n).tr[i] = t.value; }
  else if (t.dataset.write) { const n = t.dataset.write; D(n).write = t.value; const wc = $("#wc-" + n); if (wc) wc.textContent = wcount(t.value) + " parole"; }
  else return;
  clearTimeout(typeTimer); typeTimer = setTimeout(save, 600);
});
document.addEventListener("change", e => {
  if (e.target.id === "start" && /^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) { S.start = e.target.value; save(); render(); }
});
window.addEventListener("hashchange", route);
route();
connect();
</script>
